name: Build HVMC Launcher

on:
  push:
    branches: [main]
    tags: ['v*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore launcher/HVMCLauncher.csproj

      - name: Build launcher
        run: dotnet publish launcher/HVMCLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/HVMCLauncher

      - name: Create GitHub release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HVMC Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: artifacts/HVMCLauncher/HVMCLauncher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
