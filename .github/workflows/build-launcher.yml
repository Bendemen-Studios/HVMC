name: Build HVMC Launcher

on:
  push:
    branches: [main]
    tags: ['v*.*']
  workflow_dispatch:
    inputs:
      major_release:
        description: 'Approve a major release such as 4.0'
        required: false
        default: false
        type: boolean
      release_version:
        description: 'Major release version, for example 4.0 (leave empty for automatic minor release)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: hvmc-launcher-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref != 'refs/heads/main' || !contains(github.event.head_commit.message, '[no-release]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare release version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          MAJOR_RELEASE: ${{ github.event.inputs.major_release || 'false' }}
          RELEASE_VERSION: ${{ github.event.inputs.release_version || '' }}
        run: |
          $current = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
          if ($current -notmatch '^\d+\.\d+$') {
            throw "Ongeldige launcher versie in version.txt: $current. Gebruik bijvoorbeeld 3.7."
          }

          git fetch --tags --force
          $latestTag = git tag --list 'v*.*' --sort=-v:refname | Select-Object -First 1

          if ($env:MAJOR_RELEASE -eq 'true') {
            if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION) -or $env:RELEASE_VERSION -notmatch '^\d+\.0$') {
              throw 'Een goedgekeurde major release moet bijvoorbeeld 4.0 zijn.'
            }

            $target = $env:RELEASE_VERSION
            $targetMajor = [int]($target.Split('.')[0])
            $currentMajor = [int]($current.Split('.')[0])

            if ($targetMajor -le $currentMajor) {
              throw "Major release $target is niet hoger dan de huidige major versie $current."
            }

            Set-Content -LiteralPath 'version.txt' -Value $target -NoNewline
            Write-Host "Goedgekeurde major release ingesteld op $target."
          }
          else {
            if ($current -ne ($latestTag -replace '^v','') -and -not [string]::IsNullOrWhiteSpace($latestTag)) {
              $currentMajor = [int]($current.Split('.')[0])
              $latestMajor = [int](($latestTag -replace '^v','').Split('.')[0])
              if ($currentMajor -gt $latestMajor) {
                throw "Major versie $current is gedetecteerd. Deze wijziging vereist expliciete toestemming via workflow_dispatch met major_release=true en release_version=$current."
              }
            }

            $major = [int]($current.Split('.')[0])
            $minor = [int]($current.Split('.')[1]) + 1
            $target = "$major.$minor"

            if (-not [string]::IsNullOrWhiteSpace($latestTag) -and $target -eq ($latestTag -replace '^v','')) {
              $minor++
              $target = "$major.$minor"
            }

            Set-Content -LiteralPath 'version.txt' -Value $target -NoNewline
            Write-Host "Automatische minor release: $target"
          }

      - name: Commit automatic version bump
        if: github.ref == 'refs/heads/main' && github.event.inputs.major_release != 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git diff --cached --quiet || git commit -m "Auto-bump launcher minor version [no-release]"
          git push origin HEAD:main

      - name: Prepare launcher icon
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'launcher/hvmc.ico')) {
            if (-not (Test-Path -LiteralPath 'launcher/hvmc.ico.b64')) {
              throw 'Launcher icon ontbreekt.'
            }
            [IO.File]::WriteAllBytes(
              'launcher/hvmc.ico',
              [Convert]::FromBase64String([IO.File]::ReadAllText('launcher/hvmc.ico.b64'))
            )
          }

      - name: Restore
        run: dotnet restore launcher/HVMCLauncher.csproj

      - name: Build launcher
        run: dotnet publish launcher/HVMCLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/HVMCLauncher

      - name: Verify launcher artifact
        shell: pwsh
        run: |
          $exe = "artifacts/HVMCLauncher/HVMCLauncher.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "HVMCLauncher.exe ontbreekt na publish." }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 1MB) { throw "HVMCLauncher.exe lijkt ongeldig of te klein ($($item.Length) bytes)." }
          $pe = [IO.File]::ReadAllBytes($exe)
          if ($pe.Length -lt 2 -or $pe[0] -ne 0x4D -or $pe[1] -ne 0x5A) { throw "HVMCLauncher.exe heeft geen geldige MZ/PE-header." }
          Write-Host "Launcher artifact OK: $($item.Length) bytes"

      - name: Create release tag from version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+$') { throw "Ongeldige launcher versie: $version" }
          $tag = "v$version"
          git fetch --tags --force
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            Write-Host "Release tag $tag bestaat al; geen nieuwe tag aangemaakt."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "HVMC Release $tag"
          git push origin "refs/tags/$tag"
          Write-Host "Release tag $tag aangemaakt."

      - name: Create GitHub release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HVMC Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: artifacts/HVMCLauncher/HVMCLauncher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
