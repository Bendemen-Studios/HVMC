name: Build HVMC Launcher

on:
  push:
    branches: [main]
    tags: ['v*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hvmc-launcher-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare launcher source
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'launcher/hvmc.ico.b64') {
            if (-not (Test-Path -LiteralPath 'launcher/hvmc.ico')) {
              [IO.File]::WriteAllBytes('launcher/hvmc.ico', [Convert]::FromBase64String([IO.File]::ReadAllText('launcher/hvmc.ico.b64')))
            }
          }
          if (-not (Test-Path -LiteralPath 'launcher/GenerateHardenedMainWindow.ps1')) { throw 'Launcher hardening generator ontbreekt.' }
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'launcher/GenerateHardenedMainWindow.ps1' -Source 'launcher/MainWindow.xaml.cs' -Destination 'launcher/MainWindow.xaml.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        run: dotnet restore launcher/HVMCLauncher.csproj

      - name: Build launcher
        run: dotnet publish launcher/HVMCLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/HVMCLauncher

      - name: Verify launcher artifact
        shell: pwsh
        run: |
          $exe = "artifacts/HVMCLauncher/HVMCLauncher.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "HVMCLauncher.exe ontbreekt na publish." }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 1MB) { throw "HVMCLauncher.exe lijkt ongeldig of te klein ($($item.Length) bytes)." }
          $pe = [IO.File]::ReadAllBytes($exe)
          $text = [Text.Encoding]::ASCII.GetString($pe)
          if ($text -notmatch "HVMCUpdater\.ps1") { throw "Ingebouwde HVMC updater resource niet gevonden in de launcher." }
          Write-Host "Launcher artifact OK: $($item.Length) bytes"

      - name: Create GitHub release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HVMC Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: artifacts/HVMCLauncher/HVMCLauncher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
