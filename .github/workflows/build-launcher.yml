name: Build HVMC Launcher

on:
  push:
    branches: [main]
    tags: ['v*.*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional approved release version, for example 4.0'
        required: false
        default: ''
        type: string
      approve_major:
        description: 'Required when moving to a new major version such as 4.0'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: hvmc-launcher-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref != 'refs/heads/main' || !contains(github.event.head_commit.message, '[no-release]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare release version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.release_version || '' }}
          APPROVE_MAJOR: ${{ github.event.inputs.approve_major || 'false' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $current = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
          if ($current -notmatch '^\d+\.\d+$') {
            throw "Ongeldige launcher versie in version.txt: $current. Gebruik bijvoorbeeld 3.7."
          }

          git fetch --tags --force
          $latestTag = git tag --list 'v*.*' --sort=-v:refname | Select-Object -First 1
          $latestVersion = if ($latestTag) { $latestTag -replace '^v','' } else { '0.0' }

          if (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_VERSION)) {
            if ($env:REQUESTED_VERSION -notmatch '^\d+\.\d+$') {
              throw 'release_version moet bijvoorbeeld 3.7 of 4.0 zijn.'
            }

            $target = $env:REQUESTED_VERSION
            $targetMajor = [int]($target.Split('.')[0])
            $latestMajor = [int]($latestVersion.Split('.')[0])

            if ($targetMajor -gt $latestMajor -and $env:APPROVE_MAJOR -ne 'true') {
              throw "Major release $target vereist expliciete goedkeuring via approve_major=true."
            }

            if ($targetMajor -eq $latestMajor -and [int]($target.Split('.')[1]) -le [int]($latestVersion.Split('.')[1])) {
              throw "Release $target is niet hoger dan de huidige release $latestVersion."
            }

            Set-Content -LiteralPath 'version.txt' -Value $target -NoNewline
            Write-Host "Goedgekeurde release ingesteld op $target."
          }
          elseif ($current -eq $latestVersion) {
            $latestReleaseTag = "v$latestVersion"
            & gh release view $latestReleaseTag --repo $env:GITHUB_REPOSITORY *> $null
            $releaseCheckExitCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            if ($releaseCheckExitCode -ne 0) {
              $target = $current
              Write-Host "Release $latestReleaseTag ontbreekt; bestaande versie $target wordt hersteld."
            }
            else {
              $major = [int]($latestVersion.Split('.')[0])
              $minor = [int]($latestVersion.Split('.')[1]) + 1
              $target = "$major.$minor"
              Set-Content -LiteralPath 'version.txt' -Value $target -NoNewline
              Write-Host "Automatische minor release: $target"
            }
          }
          else {
            $currentMajor = [int]($current.Split('.')[0])
            $latestMajor = [int]($latestVersion.Split('.')[0])

            if ($currentMajor -lt $latestMajor) {
              throw "version.txt ($current) loopt achter op de laatste release ($latestVersion)."
            }

            if ($currentMajor -gt $latestMajor -and $env:APPROVE_MAJOR -ne 'true' -and $env:COMMIT_MESSAGE -notmatch '\[approve-major\]') {
              throw "Major release $current vereist expliciete toestemming. Gebruik [approve-major] in de commit of approve_major=true via workflow_dispatch."
            }

            $target = $current
            Write-Host "Vooraf ingestelde releaseversie gebruiken: $target"
          }

          "RELEASE_VERSION=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Commit automatic version bump
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          if (git diff --cached --quiet) {
            Write-Host "Geen automatische versiecommit nodig."
            exit 0
          }
          git commit -m "Auto-bump launcher minor version [no-release]"

          # Another release workflow can finish the same minor bump while this
          # run is still preparing its commit. In that case the remote already
          # contains the exact version we calculated, so the non-fast-forward
          # push is harmless and must not fail the build.
          git fetch origin main
          git push origin HEAD:main
          $pushExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($pushExitCode -eq 0) {
            Write-Host "Automatische versiecommit naar main gepusht."
          }
          else {
            Write-Host "Versiecommit kon niet direct worden gepusht; remote main opnieuw controleren..."
            git fetch origin main
            $localVersion = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
            $remoteVersion = (git show 'origin/main:version.txt').Trim()

            if ($localVersion -eq $remoteVersion) {
              Write-Host "Een andere release-run heeft versie $remoteVersion al naar main gepusht. Deze run gaat verder met dezelfde release."
              git reset --hard origin/main
              Set-Content -LiteralPath 'version.txt' -Value $localVersion -NoNewline
            }
            else {
              throw "Automatische versiecommit kon niet worden gepusht: remote version.txt=$remoteVersion, lokale version.txt=$localVersion."
            }
          }

      - name: Prepare launcher icon
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'launcher/hvmc.ico')) {
            if (-not (Test-Path -LiteralPath 'launcher/hvmc.ico.b64')) {
              throw 'Launcher icon ontbreekt.'
            }
            [IO.File]::WriteAllBytes(
              'launcher/hvmc.ico',
              [Convert]::FromBase64String([IO.File]::ReadAllText('launcher/hvmc.ico.b64'))
            )
          }

      - name: Restore
        run: dotnet restore launcher/HVMCLauncher.csproj

      - name: Build launcher
        run: dotnet publish launcher/HVMCLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/HVMCLauncher

      - name: Verify launcher artifact
        shell: pwsh
        run: |
          $exe = "artifacts/HVMCLauncher/HVMC School Launcher.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "HVMC School Launcher.exe ontbreekt na publish." }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 1MB) { throw "HVMC School Launcher.exe lijkt ongeldig of te klein ($($item.Length) bytes)." }
          $pe = [IO.File]::ReadAllBytes($exe)
          if ($pe.Length -lt 2 -or $pe[0] -ne 0x4D -or $pe[1] -ne 0x5A) { throw "HVMC School Launcher.exe heeft geen geldige MZ/PE-header." }
          Write-Host "Launcher artifact OK: $($item.Length) bytes"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build HVMC installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
            $env:RELEASE_VERSION = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\HVMC.iss" "/DAppVersion=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "HVMC installer bouwen mislukt." }
          $installer = "artifacts/HVMC/HVMC.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "HVMC.exe installer ontbreekt na build." }
          $item = Get-Item -LiteralPath $installer
          if ($item.Length -lt 1MB) { throw "HVMC.exe installer lijkt ongeldig of te klein ($($item.Length) bytes)." }
          $pe = [IO.File]::ReadAllBytes($installer)
          if ($pe.Length -lt 2 -or $pe[0] -ne 0x4D -or $pe[1] -ne 0x5A) { throw "HVMC.exe installer heeft geen geldige MZ/PE-header." }
          Write-Host "HVMC installer OK: $($item.Length) bytes"

      - name: Create release tag from version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+$') { throw "Ongeldige launcher versie: $version" }
          $tag = "v$version"
          git fetch --tags --force
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            Write-Host "Release tag $tag bestaat al; geen nieuwe tag aangemaakt."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "HVMC Release $tag"
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $tag kon niet naar GitHub worden gepusht."
          }
          Write-Host "Release tag $tag aangemaakt."

      - name: Create GitHub release from tag
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: HVMC Release v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          prerelease: false
          files: |
            artifacts/HVMC/HVMC.exe
            artifacts/HVMCLauncher/HVMC School Launcher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
