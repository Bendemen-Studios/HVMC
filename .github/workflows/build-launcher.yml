name: Build HVMC Launcher

on:
  push:
    branches: [main]
    tags: ['v*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch launcher source for bundled Fabric
        shell: pwsh
        run: |
          $path = 'launcher/MainWindow.xaml.cs'
          if (-not (Test-Path $path)) { throw "Launcher source ontbreekt: $path" }
          $s = Get-Content $path -Raw

          $s = [regex]::Replace($s, 'private const string LauncherVersion = "[^"]+";', 'private const string LauncherVersion = "2.4.0"')

          # Updater moet vóór CmlLib/Minecraft installatie draaien.
          $old = 'var minecraftPath = new MinecraftPath\([^;]+;\s*var minecraftLauncher = new MinecraftLauncher\(minecraftPath\);\s*\r?\n\s*SetStatus\("Minecraft voorbereiden\.\.\."\);\s*\r?\n\s*await minecraftLauncher\.InstallAsync\(MinecraftVersion\);\s*\r?\n\s*SetStatus\("HVMC content synchroniseren\.\.\."\);\s*\r?\n\s*await RunUpdaterAsync\(\);'
          $new = @'
var minecraftPath = new MinecraftPath(Environment.GetFolderPath(Environment.SpecialFolder.ApplicationData) + "\\.minecraft");

            SetStatus("HVMC content synchroniseren...");
            await RunUpdaterAsync();

            var minecraftLauncher = new MinecraftLauncher(minecraftPath);
            SetStatus("Minecraft voorbereiden...");
            await minecraftLauncher.InstallAsync(MinecraftVersion);
'@
          $s = [regex]::Replace($s, $old, $new)

          # Nooit opnieuw Fabric installeren: de updater levert het profiel als content.
          $fabric = '(?m)^\s*await minecraftLauncher\.InstallAsync\(fabricProfile\);\s*\r?\n'
          if ([regex]::IsMatch($s, $fabric)) {
            $replacement = @'
            var fabricProfilePath = Path.Combine(minecraftPath.BasePath, "versions", fabricProfile, $"{fabricProfile}.json");
            if (!File.Exists(fabricProfilePath))
                throw new InvalidOperationException($"Gebundelde Fabric ontbreekt: {fabricProfilePath}");
'@
            $s = [regex]::Replace($s, $fabric, $replacement)
          }

          # Directe lease-heartbeat + heartbeat iedere minuut met responsecontrole.
          $s = [regex]::Replace($s, 'StartLeaseHeartbeat\(_leaseId\);', 'await SendLeaseHeartbeatAsync(_leaseId);\r\n            StartLeaseHeartbeat(_leaseId);')
          $s = [regex]::Replace($s, 'Task\.Delay\(TimeSpan\.FromMinutes\(5\), cancellationToken\)', 'Task.Delay(TimeSpan.FromMinutes(1), cancellationToken)')

          if ($s -ne (Get-Content $path -Raw)) {
            Set-Content $path $s -NoNewline
            git config user.name 'HVMC Build Bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add $path
            git commit -m 'Fix launcher bundled Fabric startup'
            git push origin HEAD:main
          }

      - name: Restore
        run: dotnet restore launcher/HVMCLauncher.csproj

      - name: Build launcher
        run: dotnet publish launcher/HVMCLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/HVMCLauncher

      - name: Create GitHub release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HVMC Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: artifacts/HVMCLauncher/HVMCLauncher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
