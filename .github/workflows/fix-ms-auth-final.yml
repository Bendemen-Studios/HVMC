name: Fix Microsoft auth flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Microsoft consumer auth
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')

          # Keep the consumer tenant and request identity claims needed for stable account linking.
          import re
          s, n1 = re.subn(
              r"const MS_AUTHORITY = '[^']+';",
              "const MS_AUTHORITY = 'https://login.microsoftonline.com/consumers';",
              s, count=1
          )
          s, n2 = re.subn(
              r"const MS_SCOPE = '[^']+';",
              "const MS_SCOPE = 'openid profile offline_access XboxLive.signin';",
              s, count=1
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Could not normalize Microsoft auth constants: authority={n1}, scope={n2}')

          start_marker = 'async function profileFromAccessToken(accessToken, idToken) {'
          end_marker = '\n\nasync function refreshMicrosoftAccessToken'
          start = s.find(start_marker)
          end = s.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('profileFromAccessToken boundaries not found')

          replacement = '''async function profileFromAccessToken(accessToken, idToken) {
  // The identity must come from the Microsoft ID token, not from a Graph access token.
  // Graph is optional and is not used for account identity linking.
  if (!idToken) return null;
  try {
    const jwks = createRemoteJWKSet(new URL(`${MS_AUTHORITY}/discovery/v2.0/keys`));
    const { payload } = await jwtVerify(String(idToken), jwks, {
      audience: MICROSOFT_CLIENT_ID,
      issuer: `${MS_AUTHORITY}/v2.0`,
      algorithms: ['RS256']
    });
    const oid = String(payload.oid || payload.sub || '');
    if (!oid) return null;
    return {
      id: oid,
      displayName: String(payload.name || ''),
      userPrincipalName: String(payload.preferred_username || payload.email || ''),
      mail: String(payload.email || '')
    };
  } catch {
    return null;
  }
}'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Validate server syntax
        run: node --check server/server.js

      - name: Commit repaired server
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git diff --cached --quiet || git commit -m "Fix Microsoft consumer identity linking"
          git push origin main

      - name: Remove repair workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-ms-auth-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-ms-auth-final.yml
          git diff --cached --quiet || git commit -m "Remove temporary Microsoft auth repair workflow"
          git push origin main || true
