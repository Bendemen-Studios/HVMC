name: Apply HVMC PC management

on:
  push:
    branches: [ main ]
    paths:
      - 'server/pc-management.js'
      - '.github/workflows/pc-management-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server integration
        shell: python
        run: |
          from pathlib import Path
          p=Path('server/server.js'); s=p.read_text(encoding='utf-8')
          imp="import { registerPcManagement } from './pc-management.js';"
          if imp not in s: s=s.replace("import { jwtVerify, createRemoteJWKSet } from 'jose';", "import { jwtVerify, createRemoteJWKSet } from 'jose';\n"+imp, 1)
          if "app.get('/admin/pcs'" not in s:
              marker="app.get('/admin/', (_req, res) => res.redirect('/admin'));"
              routes="app.get('/admin/pcs', (_req, res) => res.sendFile(path.join(__dirname, 'public', 'pc-admin.html')));\napp.get('/admin/pcs/', (_req, res) => res.redirect('/admin/pcs'));"
              s=s.replace(marker, marker+'\n'+routes, 1)
          if "registerPcManagement(app, db, requireAdmin);" not in s:
              marker="function requireAdmin(req, res) {"
              start=s.find(marker); end=s.find("\n}\n", start)
              if start<0 or end<0: raise SystemExit('requireAdmin block not found')
              end+=3
              s=s[:end]+"\nregisterPcManagement(app, db, requireAdmin);\n"+s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Add PC dashboard button
        shell: python
        run: |
          from pathlib import Path
          p=Path('server/public/admin.html'); s=p.read_text(encoding='utf-8')
          needle='<button id="refresh" class="secondary">Vernieuwen</button>'
          button='<button class="secondary" onclick="location.href=\'/admin/pcs\'">PC\'s</button>'
          if '/admin/pcs' not in s and needle in s: s=s.replace(needle, needle+button, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit server integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.js server/public/admin.html
          git diff --cached --quiet || git commit -m 'Activate HVMC PC management'
          git push
