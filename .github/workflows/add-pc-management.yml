name: Apply PC authorization management

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/add-pc-management.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch repository
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')

          pc_module = r'''import crypto from 'node:crypto';

const PC_ONLINE_MS = 90_000;
const PC_CODE_TTL_MS = 15 * 60_000;
const PC_CODE_RE = /^[A-Z0-9]{10}$/;
const DEVICE_TOKEN_HEADER = 'x-hvmc-device-token';

export function registerPcManagement(app, db, requireAdmin) {
  db.exec(`
    CREATE TABLE IF NOT EXISTS organizations (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      name TEXT NOT NULL UNIQUE,
      created_at TEXT NOT NULL
    );
    CREATE TABLE IF NOT EXISTS pcs (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      client_id TEXT NOT NULL UNIQUE,
      name TEXT NOT NULL,
      device_token_hash TEXT NOT NULL,
      blocked INTEGER NOT NULL DEFAULT 0,
      deleted INTEGER NOT NULL DEFAULT 0,
      organization_id INTEGER REFERENCES organizations(id) ON DELETE SET NULL,
      last_seen_at TEXT,
      last_ip TEXT,
      os_version TEXT,
      launcher_version TEXT,
      created_at TEXT NOT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_pcs_org ON pcs(organization_id);
    CREATE TABLE IF NOT EXISTS pc_auth_codes (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      code_hash TEXT NOT NULL UNIQUE,
      expires_at TEXT NOT NULL,
      used_at TEXT,
      created_at TEXT NOT NULL
    );
  `);

  const hashCode = (code) => crypto.createHash('sha256').update(String(code)).digest('hex');
  const nowIso = () => new Date().toISOString();
  const cleanCodes = () => db.prepare('DELETE FROM pc_auth_codes WHERE expires_at <= ? OR used_at IS NOT NULL').run(nowIso());

  function getDeviceToken(req) {
    return String(req.headers[DEVICE_TOKEN_HEADER] || '').trim();
  }
  function requireDevice(req, res) {
    const clientId = String(req.body?.clientId || req.headers['x-hvmc-client-id'] || '').trim().slice(0, 200);
    const token = getDeviceToken(req);
    if (!clientId || !token) {
      res.status(401).json({ error: 'Deze pc is nog niet geautoriseerd.' });
      return null;
    }
    const pc = db.prepare('SELECT * FROM pcs WHERE client_id = ? AND deleted = 0').get(clientId);
    if (!pc) {
      res.status(403).json({ error: 'Deze pc is nog niet geautoriseerd.', codeRequired: true });
      return null;
    }
    const tokenHash = hashCode(token);
    if (!crypto.timingSafeEqual(Buffer.from(tokenHash), Buffer.from(pc.device_token_hash))) {
      res.status(403).json({ error: 'Ongeldige pc-autorisatie.' });
      return null;
    }
    if (pc.blocked) {
      res.status(403).json({ error: 'Deze pc is door een beheerder geblokkeerd.', blocked: true });
      return null;
    }
    db.prepare('UPDATE pcs SET last_seen_at=?, last_ip=? WHERE id=?').run(nowIso(), String(req.ip || req.socket.remoteAddress || ''), pc.id);
    return pc;
  }

  // Admin: one-time PC authorization codes.
  app.post('/v1/admin/pc-codes', (req, res) => {
    if (!requireAdmin(req, res)) return;
    cleanCodes();
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    do { code = Array.from({ length: 10 }, () => alphabet[crypto.randomInt(alphabet.length)]).join(''); }
    while (db.prepare('SELECT 1 FROM pc_auth_codes WHERE code_hash=?').get(hashCode(code)));
    const expiresAt = new Date(Date.now() + PC_CODE_TTL_MS).toISOString();
    db.prepare('INSERT INTO pc_auth_codes (code_hash,expires_at,created_at) VALUES (?,?,?)').run(hashCode(code), expiresAt, nowIso());
    res.json({ ok: true, code, expiresAt });
  });

  // Public: consume one-time code and bind the PC to a device token.
  app.post('/v1/launcher/pc/register', (req, res) => {
    cleanCodes();
    const clientId = String(req.body?.clientId || '').trim().slice(0, 200);
    const code = String(req.body?.code || '').trim().toUpperCase();
    const name = String(req.body?.name || 'HVMC-PC').trim().slice(0, 120) || 'HVMC-PC';
    if (!clientId || !PC_CODE_RE.test(code)) return res.status(400).json({ error: 'Ongeldige autorisatiecode.' });
    const existing = db.prepare('SELECT * FROM pcs WHERE client_id=?').get(clientId);
    if (existing && existing.deleted === 0) return res.status(409).json({ error: existing.blocked ? 'Deze pc is geblokkeerd.' : 'Deze pc is al geautoriseerd.' });
    const auth = db.prepare('SELECT * FROM pc_auth_codes WHERE code_hash=? AND used_at IS NULL AND expires_at>?').get(hashCode(code), nowIso());
    if (!auth) return res.status(401).json({ error: 'Autorisatiecode is ongeldig of verlopen.' });
    const deviceToken = crypto.randomBytes(32).toString('base64url');
    const tokenHash = hashCode(deviceToken);
    const stamp = nowIso();
    const tx = db.transaction(() => {
      db.prepare('UPDATE pc_auth_codes SET used_at=? WHERE id=?').run(stamp, auth.id);
      if (existing) {
        db.prepare('UPDATE pcs SET name=?,device_token_hash=?,blocked=0,deleted=0,last_seen_at=?,last_ip=?,created_at=? WHERE id=?').run(name, tokenHash, stamp, null, stamp, existing.id);
        return existing.id;
      }
      const info = db.prepare('INSERT INTO pcs (client_id,name,device_token_hash,created_at,last_seen_at,last_ip) VALUES (?,?,?,?,?,?)').run(clientId,name,tokenHash,stamp,null,stamp);
      return Number(info.lastInsertRowid);
    });
    res.json({ ok: true, pcId: tx(), clientId, name, deviceToken });
  });

  app.post('/v1/launcher/pc/heartbeat', (req, res) => {
    const pc = requireDevice(req, res);
    if (!pc) return;
    const osVersion = String(req.body?.osVersion || '').slice(0, 120);
    const launcherVersion = String(req.body?.launcherVersion || '').slice(0, 80);
    db.prepare('UPDATE pcs SET os_version=?,launcher_version=?,last_seen_at=?,last_ip=? WHERE id=?')
      .run(osVersion || null, launcherVersion || null, nowIso(), String(req.ip || req.socket.remoteAddress || ''), pc.id);
    res.json({ ok: true, online: true });
  });

  app.get('/v1/launcher/pc/status', (req, res) => {
    const clientId = String(req.query?.clientId || '').trim();
    const pc = db.prepare('SELECT id,client_id,name,blocked,deleted,last_seen_at FROM pcs WHERE client_id=?').get(clientId);
    if (!pc || pc.deleted) return res.status(404).json({ error: 'Deze pc is nog niet geautoriseerd.', codeRequired: true });
    if (pc.blocked) return res.status(403).json({ error: 'Deze pc is door een beheerder geblokkeerd.', blocked: true });
    res.json({ ok: true, authorized: true, online: pc.last_seen_at ? Date.now() - Date.parse(pc.last_seen_at) < PC_ONLINE_MS : false, name: pc.name });
  });

  // Public lease middleware: every launcher lease call must come from an authorized device.
  app.use('/v1/launcher/lease', (req, res, next) => {
    const pc = requireDevice(req, res);
    if (!pc) return;
    req.hvmcPc = pc;
    next();
  });

  app.get('/v1/admin/organizations', (req, res) => {
    if (!requireAdmin(req, res)) return;
    res.json({ organizations: db.prepare('SELECT id,name,created_at FROM organizations ORDER BY name').all() });
  });
  app.post('/v1/admin/organizations', (req, res) => {
    if (!requireAdmin(req, res)) return;
    const name = String(req.body?.name || '').trim().slice(0, 120);
    if (!name) return res.status(400).json({ error: 'Naam is verplicht.' });
    try {
      const info = db.prepare('INSERT INTO organizations (name,created_at) VALUES (?,?)').run(name, nowIso());
      res.json({ ok: true, id: Number(info.lastInsertRowid), name });
    } catch (err) { res.status(409).json({ error: 'Organisatie bestaat al.' }); }
  });
  app.delete('/v1/admin/organizations/:id', (req, res) => {
    if (!requireAdmin(req, res)) return;
    db.prepare('DELETE FROM organizations WHERE id=?').run(Number(req.params.id));
    res.json({ ok: true });
  });
  app.get('/v1/admin/pcs', (req, res) => {
    if (!requireAdmin(req, res)) return;
    const rows = db.prepare(`SELECT pcs.id,pcs.client_id,pcs.name,pcs.blocked,pcs.deleted,pcs.organization_id,
      organizations.name AS organization_name,pcs.last_seen_at,pcs.last_ip,pcs.os_version,pcs.launcher_version,
      leases.id AS lease_id,leases.expires_at,accounts.slot AS account_slot,accounts.label AS account_label,accounts.microsoft_username
      FROM pcs LEFT JOIN organizations ON organizations.id=pcs.organization_id
      LEFT JOIN leases ON leases.client_id=pcs.client_id
      LEFT JOIN accounts ON accounts.id=leases.account_id
      WHERE pcs.deleted=0 ORDER BY COALESCE(organizations.name,''),pcs.name`).all();
    const now = Date.now();
    res.json({ pcs: rows.map(r => ({ ...r, online: r.last_seen_at ? now - Date.parse(r.last_seen_at) < PC_ONLINE_MS : false })) });
  });
  app.patch('/v1/admin/pcs/:id', (req, res) => {
    if (!requireAdmin(req, res)) return;
    const id = Number(req.params.id);
    const pc = db.prepare('SELECT * FROM pcs WHERE id=? AND deleted=0').get(id);
    if (!pc) return res.status(404).json({ error: 'PC niet gevonden.' });
    const name = req.body?.name !== undefined ? String(req.body.name).trim().slice(0,120) : pc.name;
    const blocked = req.body?.blocked !== undefined ? (req.body.blocked ? 1 : 0) : pc.blocked;
    const organizationId = req.body?.organizationId === null || req.body?.organizationId === '' ? null : (req.body?.organizationId !== undefined ? Number(req.body.organizationId) : pc.organization_id);
    if (organizationId !== null && !db.prepare('SELECT 1 FROM organizations WHERE id=?').get(organizationId)) return res.status(400).json({ error: 'Organisatie bestaat niet.' });
    db.prepare('UPDATE pcs SET name=?,blocked=?,organization_id=? WHERE id=?').run(name,blocked,organizationId,id);
    if (blocked) db.prepare('DELETE FROM leases WHERE client_id=?').run(pc.client_id);
    res.json({ ok: true });
  });
  app.delete('/v1/admin/pcs/:id', (req, res) => {
    if (!requireAdmin(req, res)) return;
    const id = Number(req.params.id);
    const pc = db.prepare('SELECT client_id FROM pcs WHERE id=?').get(id);
    if (!pc) return res.status(404).json({ error: 'PC niet gevonden.' });
    db.prepare('DELETE FROM leases WHERE client_id=?').run(pc.client_id);
    db.prepare('UPDATE pcs SET deleted=1,blocked=1,device_token_hash=? WHERE id=?').run(hashCode(crypto.randomBytes(32).toString('base64url')),id);
    res.json({ ok: true });
  });
}
'''
          (root / 'server' / 'pc-management.js').write_text(pc_module, encoding='utf-8')

          server = root / 'server' / 'server.js'
          s = server.read_text(encoding='utf-8')
          if "./pc-management.js" not in s:
              s = s.replace("import { jwtVerify, createRemoteJWKSet } from 'jose';", "import { jwtVerify, createRemoteJWKSet } from 'jose';\nimport { registerPcManagement } from './pc-management.js';")
          marker = "function requireAdmin(req, res) {\n  if (!isAdmin(req)) {\n    res.status(401).json({ error: 'unauthorized' });\n    return false;\n  }\n  return true;\n}\n"
          if "registerPcManagement(app, db, requireAdmin);" not in s:
              if marker not in s: raise SystemExit('server marker not found')
              s = s.replace(marker, marker + "\nregisterPcManagement(app, db, requireAdmin);\n", 1)
          server.write_text(s, encoding='utf-8')

          admin = root / 'server' / 'public' / 'admin.html'
          a = admin.read_text(encoding='utf-8')
          needle = '<button id="refresh" class="secondary">Vernieuwen</button>'
          if '/admin/pcs' not in a and needle in a:
              a = a.replace(needle, needle + '<button class="secondary" onclick="location.href=\'/admin/pcs\'">PC\'s</button>')
          admin.write_text(a, encoding='utf-8')

          pcs = root / 'server' / 'public' / 'pc-admin.html'
          pc_html = r'''<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVMC PC Beheer</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20251f;background:#f7f5ef;--gold:#c9972e;--gold2:#e2b84b;--ink:#1d241f;--muted:#68716a;--line:#dfd8c8;--panel:#fffdf8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffdf9,#f5f1e7)}main{max-width:1400px;margin:auto;padding:30px 20px 60px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.brand{display:flex;gap:14px;align-items:center}.mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#d8ab43,#b98520);display:grid;place-items:center;color:#fff;font-weight:900}.kicker{color:#b48725;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:2px 0;font-size:30px}.sub{color:var(--muted)}.panel{background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 16px 40px rgba(81,65,32,.08);margin-top:16px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}input,select{background:#fff;border:1px solid #cfc6b2;border-radius:11px;padding:10px 12px}button{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#211b0e}button.secondary{background:#fff;border:1px solid #d6ccb8;box-shadow:none;color:#4c524d}button.danger{background:#b74848;color:#fff}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:#6c665b;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.online{background:#e5f4e8;color:#2e7c4a}.offline{background:#f1ece2;color:#85765c}.blocked{background:#f9e5e5;color:#9a3d3d}.grid{display:grid;grid-template-columns:1fr 2fr;gap:16px}@media(max-width:900px){.grid{grid-template-columns:1fr}table{display:block;overflow:auto}}</style></head><body><main><div class="top"><div class="brand"><div class="mark">HV</div><div><div class="kicker">Bendemen Studios</div><h1>HVMC PC Beheer</h1><div class="sub">Geautoriseerde pc's, live status, accountgebruik en organisaties.</div></div></div><div class="row"><button class="secondary" onclick="location.href='/admin'">Accountpool</button><button id="logout" class="secondary">Uitloggen</button></div></div><div class="grid"><section class="panel"><h2>Eenmalige pc-code</h2><p class="sub">Genereer een code voor een nieuwe jongeren-pc. De code is 15 minuten geldig en kan één keer worden gebruikt.</p><button id="codeBtn">Nieuwe code</button><div id="code" style="margin-top:12px;font-size:24px;font-weight:900;letter-spacing:.16em"></div><div id="codeExpiry" class="sub"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>Organisatie</h2><div class="row"><input id="orgName" placeholder="Bijv. HVMC Lokaal 1" style="flex:1"><button id="orgBtn">Toevoegen</button></div><div id="orgs" style="margin-top:12px"></div></section><section class="panel"><h2>PC's</h2><div id="msg" class="sub">Laden…</div><table><thead><tr><th>Status</th><th>PC</th><th>Organisatie</th><th>Account</th><th>Laatste verbinding</th><th>Acties</th></tr></thead><tbody id="pcs"></tbody></table></section></div></main><script>let token=sessionStorage.getItem('hvmc_admin_session')||'';const $=id=>document.getElementById(id);async function api(u,o={}){o.headers={...(o.headers||{}),authorization:'Bearer '+token,'content-type':'application/json'};const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(!r.ok){if(r.status===401){location.href='/admin'}throw Error(d.error||'API-fout')}return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])}async function load(){const [p,o]=await Promise.all([api('/v1/admin/pcs'),api('/v1/admin/organizations')]);const orgs=o.organizations||[];$('orgs').innerHTML=orgs.map(x=>`<div style="padding:6px 0">${esc(x.name)} <button class="secondary" onclick="delOrg(${x.id})">×</button></div>`).join('')||'<span class="sub">Nog geen organisaties.</span>';const rows=p.pcs||[];$('msg').textContent=rows.length+' pc(s) geregistreerd';$('pcs').innerHTML=rows.map(x=>`<tr><td><span class="pill ${x.blocked?'blocked':(x.online?'online':'offline')}">${x.blocked?'GEBLOKKEERD':(x.online?'ONLINE':'OFFLINE')}</span></td><td><b>${esc(x.name)}</b><br><small>${esc(x.client_id)}</small></td><td><select onchange="setPc(${x.id},this.value,${x.blocked})"><option value="">Geen</option>${orgs.map(o=>`<option value="${o.id}" ${String(o.id)===String(x.organization_id)?'selected':''}>${esc(o.name)}</option>`).join('')}</select></td><td>${x.account_label?esc(x.account_label)+'<br><small>'+esc(x.microsoft_username||'')+'</small>':'—'}</td><td>${x.last_seen_at?new Date(x.last_seen_at).toLocaleString('nl-NL'):'—'}</td><td><button class="secondary" onclick="togglePc(${x.id},${!x.blocked})">${x.blocked?'Blokkering opheffen':'Blokkeren'}</button> <button class="danger" onclick="removePc(${x.id})">Verwijderen</button></td></tr>`).join('')||'<tr><td colspan="6">Geen pc\'s geregistreerd.</td></tr>'}async function setPc(id,org,blocked){await api('/v1/admin/pcs/'+id,{method:'PATCH',body:JSON.stringify({organizationId:org||null,blocked})});load()}async function togglePc(id,b){await api('/v1/admin/pcs/'+id,{method:'PATCH',body:JSON.stringify({blocked:b})});load()}async function removePc(id){if(!confirm('PC verwijderen?'))return;await api('/v1/admin/pcs/'+id,{method:'DELETE'});load()}async function delOrg(id){if(!confirm('Organisatie verwijderen?'))return;await api('/v1/admin/organizations/'+id,{method:'DELETE'});load()}$('codeBtn').onclick=async()=>{const d=await api('/v1/admin/pc-codes',{method:'POST',body:'{}'});$('code').textContent=d.code;$('codeExpiry').textContent='Geldig tot '+new Date(d.expiresAt).toLocaleString('nl-NL')};$('orgBtn').onclick=async()=>{const n=$('orgName').value.trim();if(!n)return;await api('/v1/admin/organizations',{method:'POST',body:JSON.stringify({name:n})});$('orgName').value='';load()};$('logout').onclick=()=>{sessionStorage.removeItem('hvmc_admin_session');location.href='/admin'};load();setInterval(load,15000);</script></body></html>'''
          pcs.write_text(pc_html, encoding='utf-8')

          # Add an admin route without rewriting the existing admin page.
          if "app.get('/admin/pcs'" not in s:
              route = "app.get('/admin/pcs', (_req, res) => res.sendFile(path.join(__dirname, 'public', 'pc-admin.html')));\n"
              s = s.replace("app.get('/admin/', (_req, res) => res.redirect('/admin'));", "app.get('/admin/', (_req, res) => res.redirect('/admin'));\n" + route, 1)
              server.write_text(s, encoding='utf-8')

          # Patch the native launcher for one-time activation and device heartbeats.
          launcher = root / 'launcher' / 'MainWindow.xaml.cs'
          l = launcher.read_text(encoding='utf-8')
          if 'EnsurePcAuthorizedAsync' not in l:
              old = "            SetStatus(\"HVMC controleren...\");\n            await RunUpdaterAsync();\n\n            _clientId = GetStableClientId();"
              new = "            SetStatus(\"HVMC controleren...\");\n            _clientId = GetStableClientId();\n            await EnsurePcAuthorizedAsync(_clientId);\n            StartPcHeartbeat(_clientId);\n            await RunUpdaterAsync();"
              if old not in l: raise SystemExit('launcher play marker not found')
              l = l.replace(old, new, 1)
              insert_at = "    private async Task RunUpdaterAsync()\n"
              code = r'''    private async Task EnsurePcAuthorizedAsync(string clientId)
    {
        while (true)
        {
            try
            {
                using var check = await _http.GetAsync($"{PoolApi}/v1/launcher/pc/status?clientId={Uri.EscapeDataString(clientId)}");
                if (check.IsSuccessStatusCode) return;
                if (check.StatusCode != System.Net.HttpStatusCode.NotFound && check.StatusCode != System.Net.HttpStatusCode.Forbidden)
                    throw new InvalidOperationException("Pc-autorisatie controleren mislukt.");

                var codeWindow = new ActivationWindow();
                if (codeWindow.ShowDialog() != true) throw new OperationCanceledException("Deze pc is niet geautoriseerd.");
                using var content = new StringContent(JsonSerializer.Serialize(new { clientId, code = codeWindow.Code, name = Environment.MachineName }), Encoding.UTF8, "application/json");
                using var response = await _http.PostAsync($"{PoolApi}/v1/launcher/pc/register", content);
                var json = await response.Content.ReadAsStringAsync();
                if (!response.IsSuccessStatusCode) throw new InvalidOperationException(GetError(json));
                var result = JsonSerializer.Deserialize<RegisterPcResponse>(json, JsonOptions) ?? throw new InvalidOperationException("Ongeldige pc-autorisatie response.");
                var tokenPath = Path.Combine(_root, "device-token.txt");
                File.WriteAllText(tokenPath, result.DeviceToken);
                return;
            }
            catch (HttpRequestException ex)
            {
                throw new InvalidOperationException("accounts.hvmc.nl is niet bereikbaar.", ex);
            }
        }
    }

    private void StartPcHeartbeat(string clientId)
    {
        _ = Task.Run(async () =>
        {
            while (true)
            {
                try
                {
                    var tokenPath = Path.Combine(_root, "device-token.txt");
                    if (!File.Exists(tokenPath)) return;
                    var deviceToken = File.ReadAllText(tokenPath).Trim();
                    using var request = new HttpRequestMessage(HttpMethod.Post, $"{PoolApi}/v1/launcher/pc/heartbeat");
                    request.Headers.Add("X-HVMC-Device-Token", deviceToken);
                    request.Content = new StringContent(JsonSerializer.Serialize(new { clientId, osVersion = Environment.OSVersion.VersionString, launcherVersion = "1.0.0" }), Encoding.UTF8, "application/json");
                    await _http.SendAsync(request);
                    await Task.Delay(TimeSpan.FromSeconds(30));
                }
                catch { await Task.Delay(TimeSpan.FromSeconds(30)); }
            }
        });
    }

'''
              if insert_at not in l: raise SystemExit('launcher insert marker not found')
              l = l.replace(insert_at, code + insert_at, 1)
              l = l.replace("using var content = new StringContent(JsonSerializer.Serialize(new { clientId }), Encoding.UTF8, \"application/json\");", "using var content = new StringContent(JsonSerializer.Serialize(new { clientId }), Encoding.UTF8, \"application/json\");\n        content.Headers.ContentType!.CharSet = \"utf-8\";")
              # Attach device token to lease requests.
              l = l.replace("using var response = await _http.PostAsync($\"{PoolApi}/v1/launcher/lease/acquire\", content);", "using var request = new HttpRequestMessage(HttpMethod.Post, $\"{PoolApi}/v1/launcher/lease/acquire\");\n        request.Headers.Add(\"X-HVMC-Device-Token\", File.ReadAllText(Path.Combine(_root, \"device-token.txt\")).Trim());\n        request.Content = content;\n        using var response = await _http.SendAsync(request);")
              l = l.replace("await _http.PostAsync($\"{PoolApi}/v1/launcher/lease/heartbeat\", content, _heartbeatCts.Token);", "var request = new HttpRequestMessage(HttpMethod.Post, $\"{PoolApi}/v1/launcher/lease/heartbeat\");\n                    request.Headers.Add(\"X-HVMC-Device-Token\", File.ReadAllText(Path.Combine(_root, \"device-token.txt\")).Trim());\n                    request.Content = content;\n                    await _http.SendAsync(request, _heartbeatCts.Token);")
              l = l.replace("await _http.PostAsync($\"{PoolApi}/v1/launcher/lease/release\", content);", "var request = new HttpRequestMessage(HttpMethod.Post, $\"{PoolApi}/v1/launcher/lease/release\");\n            request.Headers.Add(\"X-HVMC-Device-Token\", File.ReadAllText(Path.Combine(_root, \"device-token.txt\")).Trim());\n            request.Content = content;\n            await _http.SendAsync(request);")
              l = l.replace("    private sealed record ApiError(string Error);", "    private sealed record ApiError(string Error);\n    private sealed record RegisterPcResponse(string DeviceToken);", 1)
              launcher.write_text(l, encoding='utf-8')

          # New activation dialog files.
          (root / 'launcher' / 'ActivationWindow.xaml').write_text(r'''<Window x:Class="HVMCLauncher.ActivationWindow" xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml" Title="HVMC PC activeren" Width="470" Height="270" WindowStartupLocation="CenterOwner" ResizeMode="NoResize" Background="#F7F4EC"><Grid Margin="28"><Grid.RowDefinitions><RowDefinition Height="Auto"/><RowDefinition Height="Auto"/><RowDefinition Height="Auto"/><RowDefinition Height="*"/></Grid.RowDefinitions><TextBlock Text="PC activeren" FontSize="28" FontWeight="Bold" Foreground="#B8871F"/><TextBlock Grid.Row="1" Text="Vraag een eenmalige HVMC-code aan bij de beheerder en vul deze hier in." TextWrapping="Wrap" Margin="0,12,0,14" Foreground="#746B5B"/><TextBox x:Name="CodeBox" Grid.Row="2" Height="42" FontSize="20" HorizontalContentAlignment="Center" MaxLength="10"/><StackPanel Grid.Row="3" Orientation="Horizontal" HorizontalAlignment="Right" VerticalAlignment="Bottom"><Button Content="ANNULEREN" Width="120" Height="42" Margin="0,0,10,0" Click="Cancel_Click" Background="White"/><Button Content="ACTIVEREN" Width="120" Height="42" Click="Activate_Click" Background="#D7A62F" FontWeight="Bold"/></StackPanel></Grid></Window>''', encoding='utf-8')
          (root / 'launcher' / 'ActivationWindow.xaml.cs').write_text(r'''using System.Windows; using System.Windows.Input; namespace HVMCLauncher; public partial class ActivationWindow : Window { public string Code => CodeBox.Text.Trim().ToUpperInvariant(); public ActivationWindow(){InitializeComponent();Loaded += (_,__) => CodeBox.Focus();} private void Activate_Click(object sender,RoutedEventArgs e){if(Code.Length!=10){MessageBox.Show(this,"Vul de 10-cijferige HVMC-code in.","HVMC");return;} DialogResult=true;} private void Cancel_Click(object sender,RoutedEventArgs e){DialogResult=false;} }''', encoding='utf-8')

          proj = root / 'launcher' / 'HVMCLauncher.csproj'
          ps = proj.read_text(encoding='utf-8')
          # WPF automatically includes the new Window files; no explicit item group needed.
          proj.write_text(ps, encoding='utf-8')

