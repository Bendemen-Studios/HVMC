name: Cross-platform launcher CI

on:
  push:
    branches: [cross-platform-development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj
      - run: dotnet build launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --no-restore
      - run: dotnet publish launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64
      - shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/win-x64/HVMC.exe")) { throw "Windows publish failed." }
          Compress-Archive -Path "artifacts/win-x64/*" -DestinationPath "artifacts/HVMC-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: HVMC-windows-x64
          path: artifacts/HVMC-windows-x64.zip

  macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj
      - run: dotnet build launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --no-restore
      - run: dotnet publish launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --runtime osx-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/osx-x64
      - run: |
          test -f artifacts/osx-x64/HVMC
          mkdir -p artifacts/HVMC.app/Contents/MacOS artifacts/HVMC.app/Contents/Resources
          cp artifacts/osx-x64/HVMC artifacts/HVMC.app/Contents/MacOS/HVMC
          chmod +x artifacts/HVMC.app/Contents/MacOS/HVMC
          VERSION=$(cat version.txt)
          cat > artifacts/HVMC.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>HVMC</string>
            <key>CFBundleIdentifier</key><string>nl.hvmc.launcher</string>
            <key>CFBundleName</key><string>HVMC School Launcher</string>
            <key>CFBundleDisplayName</key><string>HVMC School Launcher</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${VERSION}.0</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
          </dict></plist>
          EOF
          ditto -c -k --sequesterRsrc --keepParent artifacts/HVMC.app artifacts/HVMC-macos-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HVMC-macos-x64
          path: artifacts/HVMC-macos-x64.zip

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj
      - run: dotnet build launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --no-restore
      - run: dotnet publish launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --runtime osx-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/osx-arm64
      - run: |
          test -f artifacts/osx-arm64/HVMC
          mkdir -p artifacts/HVMC-arm64.app/Contents/MacOS artifacts/HVMC-arm64.app/Contents/Resources
          cp artifacts/osx-arm64/HVMC artifacts/HVMC-arm64.app/Contents/MacOS/HVMC
          chmod +x artifacts/HVMC-arm64.app/Contents/MacOS/HVMC
          VERSION=$(cat version.txt)
          cat > artifacts/HVMC-arm64.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>HVMC</string>
            <key>CFBundleIdentifier</key><string>nl.hvmc.launcher</string>
            <key>CFBundleName</key><string>HVMC School Launcher</string>
            <key>CFBundleDisplayName</key><string>HVMC School Launcher</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${VERSION}.0</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
          </dict></plist>
          EOF
          ditto -c -k --sequesterRsrc --keepParent artifacts/HVMC-arm64.app artifacts/HVMC-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HVMC-macos-arm64
          path: artifacts/HVMC-macos-arm64.zip
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj
      - run: dotnet build launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --no-restore
      - run: dotnet publish launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/linux-x64
      - run: |
          test -f artifacts/linux-x64/HVMC
          chmod +x artifacts/linux-x64/HVMC
          sudo apt-get update
          sudo apt-get install -y xvfb
          set +e
          timeout 15s xvfb-run -a ./artifacts/linux-x64/HVMC > artifacts/linux-x64/runtime-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            cat artifacts/linux-x64/runtime-smoke.log
            echo "Linux launcher exited unexpectedly with code $code."
            exit 1
          fi
          if grep -Eqi 'DllNotFoundException|libSkiaSharp|BadImageFormatException|Unable to load shared library' artifacts/linux-x64/runtime-smoke.log; then
            cat artifacts/linux-x64/runtime-smoke.log
            echo "Linux native runtime smoke test detected a native library failure."
            exit 1
          fi
          tar -C artifacts/linux-x64 -czf artifacts/HVMC-linux-x64.tar.gz HVMC
      - uses: actions/upload-artifact@v4
        with:
          name: HVMC-linux-x64
          path: artifacts/HVMC-linux-x64.tar.gz

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj
      - run: dotnet build launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --no-restore
      - run: dotnet publish launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --runtime linux-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/linux-arm64
      - run: |
          test -f artifacts/linux-arm64/HVMC
          chmod +x artifacts/linux-arm64/HVMC
          tar -C artifacts/linux-arm64 -czf artifacts/HVMC-linux-arm64.tar.gz HVMC
      - uses: actions/upload-artifact@v4
        with:
          name: HVMC-linux-arm64
          path: artifacts/HVMC-linux-arm64.tar.gz
