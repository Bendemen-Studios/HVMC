name: Cross-platform launcher CI

on:
  push:
    branches: [cross-platform-development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj
      - run: dotnet build launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --no-restore
      - run: dotnet publish launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/win-x64
      - shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/win-x64/HVMC.exe")) { throw "Windows publish failed." }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj
      - run: dotnet build launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --no-restore
      - run: dotnet publish launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --runtime osx-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/osx-x64
      - run: test -f artifacts/osx-x64/HVMC

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj
      - run: dotnet build launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --no-restore
      - run: dotnet publish launcher-crossplatform/HVMCLauncher.CrossPlatform.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/linux-x64
      - run: test -f artifacts/linux-x64/HVMC
