name: Apply launcher runtime and lease fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('launcher/MainWindow.xaml.cs')
          s = p.read_text(encoding='utf-8')

          s = s.replace('private const string LauncherVersion = "2.1.0";', 'private const string LauncherVersion = "2.4.0";')

          old_play = '''            var minecraftPath = new MinecraftPath(Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ApplicationData), ".minecraft"));
            var minecraftLauncher = new MinecraftLauncher(minecraftPath);

            SetStatus("Minecraft voorbereiden...");
            await minecraftLauncher.InstallAsync(MinecraftVersion);

            SetStatus("HVMC content synchroniseren...");
            await RunUpdaterAsync();'''
          new_play = '''            var minecraftPath = new MinecraftPath(Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ApplicationData), ".minecraft"));

            // Synchronize HVMC content, Minecraft and the pinned Fabric loader BEFORE
            // CmlLib is allowed to inspect/build a Fabric profile. This prevents an
            // obsolete fabric-loader-0.18.1 profile from being selected accidentally.
            SetStatus("HVMC content synchroniseren...");
            await RunUpdaterAsync();

            var minecraftLauncher = new MinecraftLauncher(minecraftPath);
            SetStatus("Minecraft voorbereiden...");
            await minecraftLauncher.InstallAsync(MinecraftVersion);'''
          if old_play not in s:
              raise SystemExit('Expected launcher startup block not found')
          s = s.replace(old_play, new_play, 1)

          old_heartbeat_start = '''    private void StartLeaseHeartbeat(string clientId, string deviceToken, string leaseId)
    {
        _leaseHeartbeatCts?.Cancel();
        _leaseHeartbeatCts = new CancellationTokenSource();
        var token = _leaseHeartbeatCts.Token;
        _ = Task.Run(async () =>
        {
            while (!token.IsCancellationRequested)
            {
                try
                {
                    await Task.Delay(TimeSpan.FromMinutes(5), token);
                    if (token.IsCancellationRequested) break;
                    using var request = new HttpRequestMessage(HttpMethod.Post, $"{PoolApi}/v1/launcher/lease/heartbeat");
                    request.Headers.Add("x-hvmc-client-id", clientId);
                    request.Headers.Add("x-hvmc-device-token", deviceToken);
                    request.Content = new StringContent(JsonSerializer.Serialize(new { clientId, leaseId }), Encoding.UTF8, "application/json");
                    await _http.SendAsync(request, token);
                }
                catch (OperationCanceledException) { break; }
                catch { }
            }
        }, token);
    }'''
          new_heartbeat_start = '''    private void StartLeaseHeartbeat(string clientId, string deviceToken, string leaseId)
    {
        _leaseHeartbeatCts?.Cancel();
        _leaseHeartbeatCts = new CancellationTokenSource();
        var token = _leaseHeartbeatCts.Token;
        _ = Task.Run(async () =>
        {
            while (!token.IsCancellationRequested)
            {
                try
                {
                    await Task.Delay(TimeSpan.FromMinutes(1), token);
                    if (token.IsCancellationRequested) break;
                    await SendLeaseHeartbeatAsync(clientId, deviceToken, leaseId, token);
                }
                catch (OperationCanceledException) { break; }
                catch { }
            }
        }, token);
    }

    private async Task SendLeaseHeartbeatAsync(string clientId, string deviceToken, string leaseId, CancellationToken cancellationToken = default)
    {
        using var request = new HttpRequestMessage(HttpMethod.Post, $"{PoolApi}/v1/launcher/lease/heartbeat");
        request.Headers.Add("x-hvmc-client-id", clientId);
        request.Headers.Add("x-hvmc-device-token", deviceToken);
        request.Content = new StringContent(JsonSerializer.Serialize(new { clientId, leaseId }), Encoding.UTF8, "application/json");
        using var response = await _http.SendAsync(request, cancellationToken);
        var json = await response.Content.ReadAsStringAsync(cancellationToken);
        if (!response.IsSuccessStatusCode) throw new InvalidOperationException(GetError(json));
    }'''
          if old_heartbeat_start not in s:
              raise SystemExit('Expected lease heartbeat block not found')
          s = s.replace(old_heartbeat_start, new_heartbeat_start, 1)

          old_lease = '''            _leaseId = lease.LeaseId;
            SetStatus($"{lease.AccountName} geselecteerd.");'''
          new_lease = '''            _leaseId = lease.LeaseId;
            SetStatus($"{lease.AccountName} geselecteerd.");

            // Extend/confirm the lease immediately. The background heartbeat then
            // continues every 60 seconds while Minecraft is running.
            await SendLeaseHeartbeatAsync(_clientId, _deviceToken, _leaseId);'''
          if old_lease not in s:
              raise SystemExit('Expected lease assignment block not found')
          s = s.replace(old_lease, new_lease, 1)

          p.write_text(s, encoding='utf-8')
          Path('version.txt').write_text('2.4.0\n', encoding='utf-8')
          PY

      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/MainWindow.xaml.cs version.txt
          git rm .github/workflows/one-time-fix-launcher.yml
          git diff --cached --quiet || git commit -m "Fix launcher runtime sync and lease heartbeat"
          git push origin main
