name: Fix consumer Microsoft identity linking

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Microsoft consumer identity flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')

          old_scope = "const MS_SCOPE = 'offline_access XboxLive.signin';"
          new_scope = "const MS_SCOPE = 'openid profile offline_access XboxLive.signin';"
          if old_scope not in s:
              if new_scope not in s:
                  raise SystemExit('Expected MS_SCOPE line not found')
          else:
              s = s.replace(old_scope, new_scope, 1)

          start = s.index('async function profileFromAccessToken(accessToken, idToken) {')
          end = s.index('\n\nasync function refreshMicrosoftAccessToken', start)
          replacement = r'''async function profileFromAccessToken(accessToken, idToken) {
  if (!idToken) return null;
  try {
    const jwks = createRemoteJWKSet(new URL(`${MS_AUTHORITY}/discovery/v2.0/keys`));
    const { payload } = await jwtVerify(String(idToken), jwks, {
      audience: MICROSOFT_CLIENT_ID,
      issuer: `${MS_AUTHORITY}/v2.0`,
      algorithms: ['RS256']
    });
    const oid = String(payload.oid || payload.sub || '');
    if (!oid) return null;
    return {
      id: oid,
      displayName: String(payload.name || ''),
      userPrincipalName: String(payload.preferred_username || payload.email || ''),
      mail: String(payload.email || '')
    };
  } catch {
    return null;
  }
}'''
          s = s[:start] + replacement + s[end:]

          p.write_text(s, encoding='utf-8')
      - name: Validate server syntax
        run: node --check server/server.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          git diff --cached --quiet || git commit -m "Fix consumer Microsoft identity claims"
          git push origin main
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-consumer-identity.yml
          git add .github/workflows/fix-consumer-identity.yml || true
          git diff --cached --quiet || git commit -m "Remove temporary identity fix workflow"
          git push origin main || true
