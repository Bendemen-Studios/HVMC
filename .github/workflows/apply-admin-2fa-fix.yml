name: Apply Admin 2FA Final Fix

on:
  push:
    paths:
      - '.github/workflows/apply-admin-2fa-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix verification lookup
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')
          old = "  const stored = emailAuthCodes.get(email);"
          new = "  const stored = emailAuthCodes.get(challengeId);"
          if old not in s:
              raise SystemExit('Expected verification lookup not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: node --check server/server.js
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-admin-2fa-fix.yml
          git config user.name 'HVMC Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.js .github/workflows/apply-admin-2fa-fix.yml
          git commit -m 'Fix admin 2FA verification lookup'
          git push
