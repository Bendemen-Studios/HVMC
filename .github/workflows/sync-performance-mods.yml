name: Maintain GitHub content index

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '.github/workflows/sync-performance-mods.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build content index
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess

          tree_sha = subprocess.check_output(["git", "rev-parse", "HEAD:content"], text=True).strip()
          files = []
          for root, _, names in os.walk("content"):
              for name in names:
                  path = os.path.join(root, name).replace("\\", "/")
                  if not path.startswith("content/"):
                      continue
                  with open(path, "rb") as handle:
                      data = handle.read()
                  header = f"blob {len(data)}\0".encode()
                  sha = hashlib.sha1(header + data).hexdigest()
                  files.append({"path": path, "sha": sha})

          files.sort(key=lambda item: item["path"])
          with open("content-index.json", "w", encoding="utf-8", newline="\n") as handle:
              json.dump({
                  "version": "generated",
                  "treeSha": tree_sha,
                  "files": files
              }, handle, indent=2)
              handle.write("\n")

      - name: Commit updated index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-index.json
          if git diff --cached --quiet; then
            echo 'Content index is already current.'
            exit 0
          fi
          git commit -m 'Update GitHub content index'

          for attempt in 1 2 3; do
            git fetch origin main --force
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo 'Content index update pushed.'
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push/rebase attempt $attempt failed; retrying."
              sleep $((attempt * 2))
              git fetch origin main --force
              git reset --hard origin/main
              python - <<'PY'
