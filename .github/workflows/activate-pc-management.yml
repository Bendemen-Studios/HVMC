name: Activate HVMC PC management

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/activate-pc-management.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate PC API and dashboard
        shell: python
        run: |
          from pathlib import Path
          server = Path('server/server.js')
          s = server.read_text(encoding='utf-8')
          imp = "import { registerPcManagement } from './pc-management.js';"
          if imp not in s:
              s = s.replace("import { jwtVerify, createRemoteJWKSet } from 'jose';", "import { jwtVerify, createRemoteJWKSet } from 'jose';\n" + imp, 1)
          routes = "app.get('/admin/pcs', (_req, res) => res.sendFile(path.join(__dirname, 'public', 'pc-admin.html')));\napp.get('/admin/pcs/', (_req, res) => res.redirect('/admin/pcs'));"
          marker = "app.get('/admin/', (_req, res) => res.redirect('/admin'));"
          if "app.get('/admin/pcs'" not in s:
              s = s.replace(marker, marker + "\n" + routes, 1)
          marker2 = "function requireAdmin(req, res) {"
          start = s.find(marker2)
          if "registerPcManagement(app, db, requireAdmin);" not in s:
              if start < 0: raise SystemExit('requireAdmin marker missing')
              end = s.find("\n}\n", start)
              if end < 0: raise SystemExit('requireAdmin end missing')
              end += 3
              s = s[:end] + "\nregisterPcManagement(app, db, requireAdmin);\n" + s[end:]
          server.write_text(s, encoding='utf-8')

          admin = Path('server/public/admin.html')
          a = admin.read_text(encoding='utf-8')
          needle = '<button id="refresh" class="secondary">Vernieuwen</button>'
          button = '<button class="secondary" onclick="location.href=\'/admin/pcs\'">PC\'s</button>'
          if '/admin/pcs' not in a and needle in a:
              a = a.replace(needle, needle + button, 1)
          admin.write_text(a, encoding='utf-8')
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.js server/public/admin.html
          git diff --cached --quiet || git commit -m 'Activate PC management API'
          git push
