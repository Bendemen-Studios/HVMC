name: Fix Xbox Live Microsoft authority

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch server authentication
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')
          old = "const MS_AUTHORITY = 'https://login.microsoftonline.com/common';\nconst MS_SCOPE = 'openid profile offline_access XboxLive.signin';"
          new = "const MS_AUTHORITY = 'https://login.microsoftonline.com/consumers';\nconst MS_SCOPE = 'offline_access XboxLive.signin';"
          if old not in s:
              if "https://login.microsoftonline.com/consumers" in s and "offline_access XboxLive.signin" in s:
                  print('Already fixed')
              else:
                  raise SystemExit('Expected authentication constants not found')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Patched')

      - name: Commit server fix and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-xbox-microsoft-authority.yml
          if git diff --quiet -- server/server.js; then
            git add -A .github/workflows/fix-xbox-microsoft-authority.yml
            git diff --cached --quiet || git commit -m 'Remove temporary Xbox auth fix workflow'
          else
            git add server/server.js
            git add -A .github/workflows/fix-xbox-microsoft-authority.yml
            git commit -m 'Fix Xbox Live Microsoft authentication authority'
          fi
          git push