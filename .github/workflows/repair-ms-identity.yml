name: Repair Microsoft identity flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair server identity flow
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')

          # Keep the consumer authority and request OIDC claims plus Xbox access.
          s, n = re.subn(
              r"const MS_AUTHORITY = 'https://login\.microsoftonline\.com/[^']+';",
              "const MS_AUTHORITY = 'https://login.microsoftonline.com/consumers';",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('MS_AUTHORITY line not found')

          s, n = re.subn(
              r"const MS_SCOPE = '[^']+';",
              "const MS_SCOPE = 'openid profile offline_access XboxLive.signin';",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('MS_SCOPE line not found')

          start = s.find('async function profileFromAccessToken(accessToken, idToken) {')
          end = s.find('\n\nasync function refreshMicrosoftAccessToken', start)
          if start < 0 or end < 0:
              raise SystemExit('profileFromAccessToken boundaries not found')

          replacement = '''async function profileFromAccessToken(accessToken, idToken) {
  if (!idToken) return null;
  try {
    const jwks = createRemoteJWKSet(new URL(`${MS_AUTHORITY}/discovery/v2.0/keys`));
    const { payload } = await jwtVerify(String(idToken), jwks, {
      audience: MICROSOFT_CLIENT_ID,
      issuer: `${MS_AUTHORITY}/v2.0`,
      algorithms: ['RS256']
    });
    const oid = String(payload.oid || payload.sub || '');
    if (!oid) return null;
    return {
      id: oid,
      displayName: String(payload.name || ''),
      userPrincipalName: String(payload.preferred_username || payload.email || ''),
      mail: String(payload.email || '')
    };
  } catch {
    return null;
  }
}'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Validate
        run: node --check server/server.js

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js
          if git diff --cached --quiet; then
            echo "No repair changes needed."
          else
            git commit -m "Fix Microsoft consumer identity claims"
            git push origin main
          fi

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/repair-ms-identity.yml || true
          if git diff --cached --quiet; then
            echo "Temporary workflow already removed."
          else
            git commit -m "Remove temporary Microsoft identity repair workflow"
            git push origin main || true
          fi
