name: One-time Minecraft 26.2 content update

on:
  push:
    paths:
      - '.github/trigger-mc262-update'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Fabric runtime and mods
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mc = '26.2'
          $loader = '0.19.3'
          $repo = 'Bendemen-Studios/HVMC'

          Write-Host "Downloading Fabric $loader for Minecraft $mc..."
          $profileUrl = "https://meta.fabricmc.net/v2/versions/loader/$mc/$loader/profile/json"
          $profile = Invoke-RestMethod -Uri $profileUrl -TimeoutSec 60
          if (-not $profile) { throw "Fabric profile kon niet worden opgehaald." }

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'content/libraries'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'content/versions'
          New-Item -ItemType Directory -Force -Path 'content/libraries','content/versions' | Out-Null

          $profileDir = "content/versions/fabric-loader-$loader-$mc"
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          $profilePath = Join-Path $profileDir "fabric-loader-$loader-$mc.json"
          $profile | ConvertTo-Json -Depth 50 | Set-Content -Encoding UTF8 $profilePath

          $libraries = @($profile.libraries)
          foreach ($lib in $libraries) {
            if (-not $lib.name) { continue }
            $parts = ([string]$lib.name).Split(':')
            if ($parts.Count -lt 3) { continue }
            $group = $parts[0].Replace('.','/')
            $name = $parts[1]
            $version = $parts[2]
            $relative = "$group/$name/$version/$name-$version.jar"
            $destination = Join-Path 'content/libraries' $relative
            $parent = Split-Path -Parent $destination
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            $url = "https://maven.fabricmc.net/$relative"
            Write-Host "Downloading library $($lib.name)"
            Invoke-WebRequest -Uri $url -OutFile $destination -TimeoutSec 180
          }

          $mods = @(
            @{slug='immediatelyfast'; name='ImmediatelyFast'},
            @{slug='appleskin'; name='AppleSkin'},
            @{slug='cloth-config'; name='Cloth Config'},
            @{slug='drippy-loading-screen'; name='Drippy Loading Screen'},
            @{slug='dynamic-fps'; name='Dynamic FPS'},
            @{slug='entityculling'; name='Entity Culling'},
            @{slug='fabric-api'; name='Fabric API'},
            @{slug='fancymenu'; name='FancyMenu'},
            @{slug='ferrite-core'; name='FerriteCore'},
            @{slug='konkrete'; name='Konkrete'},
            @{slug='language-reload'; name='Language Reload'},
            @{slug='melody'; name='Melody'},
            @{slug='moreculling'; name='More Culling'},
            @{slug='notenoughanimations'; name='Not Enough Animations'},
            @{slug='packetfixer'; name='Packet Fixer'},
            @{slug='reeses-sodium-options'; name="Reese's Sodium Options"},
            @{slug='sodium-extra'; name='Sodium Extra'},
            @{slug='sodium'; name='Sodium'}
          )

          # Keep the custom/user-supplied Adaptive Graphics mod in place.
          $adaptive = 'content/mods/adaptive-graphics-0.2-beta.jar'
          if (-not (Test-Path $adaptive)) { throw "Custom Adaptive Graphics mod ontbreekt: $adaptive" }

          Get-ChildItem -Path 'content/mods' -File -Filter '*.jar' |
            Where-Object { $_.FullName -ne (Resolve-Path $adaptive).Path } |
            Remove-Item -Force

          foreach ($mod in $mods) {
            $encodedLoader = '%5B%22fabric%22%5D'
            $encodedGame = '%5B%2226.2%22%5D'
            $url = "https://api.modrinth.com/v3/project/$($mod.slug)/version?loaders=$encodedLoader&game_versions=$encodedGame"
            $versions = @(Invoke-RestMethod -Uri $url -TimeoutSec 60)
            $version = @($versions |
              Where-Object { $_.version_type -eq 'release' } |
              Select-Object -First 1) | Select-Object -First 1
            if (-not $version) {
              throw "Geen stabiele Fabric 26.2 release gevonden voor $($mod.name)."
            }
            $file = @($version.files) | Where-Object { $_.primary -eq $true } | Select-Object -First 1
            if (-not $file) { $file = @($version.files) | Where-Object { $_.filename -like '*.jar' } | Select-Object -First 1 }
            if (-not $file) { throw "Geen JAR gevonden voor $($mod.name) versie $($version.version_number)." }

            $destination = Join-Path 'content/mods' ([string]$file.filename)
            Write-Host "Downloading $($mod.name) $($version.version_number) -> $destination"
            Invoke-WebRequest -Uri $file.url -OutFile $destination -TimeoutSec 240
          }

          Write-Host "Fabric $loader for Minecraft $mc and all compatible release mods downloaded."
          Write-Host "Adaptive Graphics retained as custom mod."

      - name: Remove one-time update trigger
        shell: bash
        run: rm -f .github/trigger-mc262-update .github/workflows/update-mc262-content.yml

      - name: Commit updated content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content launcher/MainWindow.xaml.cs HVMCUpdater.ps1 .github/workflows/update-mc262-content.yml .github/trigger-mc262-update
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Minecraft 26.2 Fabric and content"
          git push
