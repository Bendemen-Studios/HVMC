name: One-time Minecraft 26.2 content rebuild

on:
  push:
    paths:
      - '.github/trigger-mc262-rebuild'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Fabric 26.2 and compatible mods
        shell: bash
        run: |
          set -euo pipefail

          MC='26.2'
          LOADER='0.19.3'

          rm -rf content/libraries content/versions
          mkdir -p content/libraries content/versions content/mods

          echo "Downloading Fabric profile..."
          curl -fsSL "https://meta.fabricmc.net/v2/versions/loader/$MC/$LOADER/profile/json" -o /tmp/fabric-profile.json
          test -s /tmp/fabric-profile.json

          PROFILE_DIR="content/versions/fabric-loader-$LOADER-$MC"
          mkdir -p "$PROFILE_DIR"
          jq -S . /tmp/fabric-profile.json > "$PROFILE_DIR/fabric-loader-$LOADER-$MC.json"

          echo "Downloading Fabric libraries..."
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            IFS=':' read -r group artifact version rest <<< "$name"
            [ -n "${rest:-}" ] && continue
            relative="${group//.//}/$artifact/$version/$artifact-$version.jar"
            destination="content/libraries/$relative"
            mkdir -p "$(dirname "$destination")"
            echo "  $name"
            curl -fsSL "https://maven.fabricmc.net/$relative" -o "$destination"
          done < <(jq -r '.libraries[]?.name // empty' /tmp/fabric-profile.json)

          # Preserve the custom/user-supplied Adaptive Graphics mod.
          adaptive='content/mods/adaptive-graphics-0.2-beta.jar'
          if [[ ! -f "$adaptive" ]]; then
            echo "ERROR: custom Adaptive Graphics mod is missing: $adaptive" >&2
            exit 1
          fi

          find content/mods -maxdepth 1 -type f -name '*.jar' ! -name 'adaptive-graphics-0.2-beta.jar' -delete

          mods=(
            'immediatelyfast'
            'appleskin'
            'cloth-config'
            'drippy-loading-screen'
            'dynamic-fps'
            'entityculling'
            'fabric-api'
            'fancymenu'
            'ferrite-core'
            'konkrete'
            'language-reload'
            'melody'
            'moreculling'
            'not-enough-animations'
            'packet-fixer'
            'reeses-sodium-options'
            'sodium-extra'
            'sodium'
          )

          echo "Downloading latest stable Fabric-compatible releases for Minecraft $MC..."
          for slug in "${mods[@]}"; do
            json="/tmp/$slug.json"
            curl -fsSL "https://api.modrinth.com/v3/project/$slug/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22$MC%22%5D" -o "$json"

            selected=$(jq -r '
              [
                .[]
                | select(.version_type == "release")
                | select((.version_number | test("alpha|beta|rc|snapshot"; "i")) | not)
              ]
              | sort_by(.date_published)
              | last
            ' "$json")

            if [[ -z "$selected" || "$selected" == "null" ]]; then
              echo "ERROR: no stable Fabric release for Minecraft $MC: $slug" >&2
              exit 1
            fi

            version=$(jq -r '.version_number' <<<"$selected")
            file=$(jq -r '(.files[] | select(.primary == true) | .url), (.files[] | select(.filename | endswith(".jar")) | .url) | select(. != null and . != "")' <<<"$selected" | head -n 1)
            filename=$(jq -r '(.files[] | select(.primary == true) | .filename), (.files[] | select(.filename | endswith(".jar")) | .filename) | select(. != null and . != "")' <<<"$selected" | head -n 1)

            if [[ -z "$file" || -z "$filename" ]]; then
              echo "ERROR: no JAR for $slug $version" >&2
              exit 1
            fi

            echo "  $slug -> $version -> $filename"
            curl -fsSL "$file" -o "content/mods/$filename"
          done

          echo "Fabric profile:"
          jq -r '.id' /tmp/fabric-profile.json
          echo "Content rebuild complete."

      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/trigger-mc262-rebuild
          rm -f .github/workflows/update-mc262-content.yml

      - name: Commit content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content .github/trigger-mc262-rebuild .github/workflows/update-mc262-content.yml
          git commit -m "Rebuild Minecraft 26.2 Fabric content"
          git push
