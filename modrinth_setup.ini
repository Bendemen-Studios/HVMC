[Settings]
AppName = Modrinth App
AutoUpdate = true
TargetDirectory = ./HV School Launcher Minecraft
SkipIfExists = true

[Tasks]
Task1 = DownloadUpdateModrinthApp
Task2 = DownloadAndInstallModpackHV

[Task1]
Name = Modrinth App Installer
Type = download_executable
SourceURL = https://modrinth.com/app/download/desktop/exe
Destination = ./HV School Launcher Minecraft/modrinth_app_setup.exe
Action = install_or_update

[Task2]
Name = HV Modpack Auto Install
Type = download_and_install
VersionURL = https://github.com/JustPetrov/HVMC/raw/refs/heads/main/modrinth_setup.ini
SourceURL = https://github.com/JustPetrov/HVMC/raw/refs/heads/main/HV%201.0.0.mrpack
Destination = ./HV School Launcher Minecraft/HV-1.0.0.mrpack
Format = mrpack
AutoInstall = true
Launcher = ModrinthApp
SkipIfExists = true