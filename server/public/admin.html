<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVMC Admin</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20251f;background:#f7f5ef;--gold:#c9972e;--gold2:#e2b84b;--ink:#1d241f;--muted:#68716a;--line:#dfd8c8;--panel:#fffdf8}
*{box-sizing:border-box}html{width:100%;overflow-x:hidden}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fffdf9 0%,#f5f1e7 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 0%,rgba(201,151,46,.10),transparent 30%),radial-gradient(circle at 85% 10%,rgba(201,151,46,.08),transparent 26%)}
main{position:relative;max-width:1180px;width:100%;margin:0 auto;padding:34px 20px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.brand{display:flex;gap:14px;align-items:center;min-width:0}.mark{width:52px;height:52px;flex:0 0 auto;border-radius:16px;background:linear-gradient(145deg,#d8ab43,#b98520);display:grid;place-items:center;color:white;font-weight:900;box-shadow:0 8px 24px rgba(176,128,28,.25);letter-spacing:-1px}.kicker{color:#b48725;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.top h1{margin:2px 0 0;font-size:31px;color:var(--ink)}.sub{color:var(--muted);margin-top:5px}
.panel{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 16px 40px rgba(81,65,32,.08);margin-top:16px}.panel h2{margin:0 0 14px;color:var(--ink);font-size:20px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-width:0}input{min-width:0;max-width:100%;background:#fff;color:var(--ink);border:1px solid #cfc6b2;border-radius:12px;padding:12px 13px;outline:none;box-shadow:inset 0 1px 0 rgba(0,0,0,.02)}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,151,46,.12)}button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#211b0e;box-shadow:0 7px 16px rgba(201,151,46,.16);white-space:normal}button:hover{filter:brightness(1.03)}button.secondary{background:#fff;border:1px solid #d6ccb8;box-shadow:none;color:#4c524d}.danger{background:#b74848;color:#fff;box-shadow:none}.warn{background:#dcc07b;color:#2d2410;box-shadow:none}.ghost{background:transparent;border:1px dashed #cabb98;color:#7b621f;box-shadow:none}.msg{color:var(--muted);font-size:14px;margin-top:10px;overflow-wrap:anywhere}.ok{color:#2e7c4a}.error{color:#9b3939}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stat{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;color:#566057}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.cardtop{display:flex;justify-content:space-between;gap:12px;align-items:center;min-width:0}.slot{font-size:17px;font-weight:900;color:var(--ink);min-width:0;overflow-wrap:anywhere}.pill{border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;letter-spacing:.04em;flex:0 0 auto;text-align:center}.free{background:#e5f4e8;color:#2e7c4a}.busy{background:#f9e5e5;color:#9a3d3d}.off{background:#f3ebd5;color:#82631c}.meta{color:#68716a;font-size:13px;line-height:1.65;margin-top:12px;min-height:66px;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.loginWrap{width:100%;max-width:520px;margin:90px auto 0}.loginBrand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:20px}.loginBrand .mark{width:68px;height:68px;border-radius:22px;font-size:21px}.help{padding:11px 13px;border-radius:12px;background:#fbf8f0;border:1px solid #eadfca;color:#756d5d;font-size:13px;margin-top:12px}.hidden{display:none!important}
@media(max-width:900px){main{padding:26px 16px 48px}.top{align-items:flex-start;flex-direction:column;gap:14px}.top>.row{width:100%}.top>.row button{flex:1 1 140px}.panel{padding:17px;border-radius:18px}.grid{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}}
@media(max-width:600px){main{padding:18px 12px 36px}.brand{gap:10px;align-items:flex-start}.mark{width:44px;height:44px;border-radius:13px}.top h1{font-size:24px;line-height:1.15}.kicker{font-size:10px;letter-spacing:.13em}.sub{font-size:13px}.panel{padding:14px;border-radius:16px}.panel h2{font-size:18px}.row{align-items:stretch}.row input,.row button{width:100%;flex:1 1 100%}.summary{gap:7px}.stat{flex:1 1 calc(50% - 7px);text-align:center}.grid{grid-template-columns:1fr;gap:11px}.card{padding:14px}.cardtop{align-items:flex-start}.pill{max-width:46%}.actions button{flex:1 1 140px}.loginWrap{margin:34px auto 0}.loginBrand h1{font-size:26px}.loginBrand .mark{width:60px;height:60px}.loginWrap .row{display:grid;grid-template-columns:1fr;gap:9px}}
@media(max-width:380px){main{padding-left:9px;padding-right:9px}.panel{padding:12px}.top>.row button,.actions button{flex-basis:100%}.stat{flex-basis:100%}.top h1{font-size:22px}}
</style>
</head>
<body>
<main id="loginPage" class="loginWrap">
  <div class="loginBrand"><div class="mark">HV</div><div class="kicker" style="margin-top:14px">Bendemen Studios</div><h1>HVMC Admin</h1><div class="sub">Beheer de centrale Minecraft-accountpool.</div></div>
  <section class="panel">
    <h2>Beheerderslogin</h2>
    <div class="row"><input id="username" autocomplete="username" placeholder="Gebruikersnaam" style="flex:1"><input id="password" type="password" autocomplete="current-password" placeholder="Wachtwoord" style="flex:1"><button id="loginBtn">Inloggen</button></div>
    <div id="loginMsg" class="msg">Log in om de accountpool te beheren.</div>
  </section>
</main>

<main id="appPage" class="hidden">
  <div class="top">
    <div class="brand"><div class="mark">HV</div><div><div class="kicker">Bendemen Studios</div><h1>HVMC Admin</h1><div class="sub">Centrale Minecraft-accountpool</div></div></div>
    <div class="row"><button id="refresh" class="secondary">Vernieuwen</button><button class="secondary" onclick="location.href='/admin/pcs'">PC's</button><button id="reset" class="danger">Alles resetten</button><button id="logout" class="ghost">Uitloggen</button></div>
  </div>

  <section class="panel">
    <h2>Accounts</h2>
    <div class="row"><input id="label" placeholder="Bijv. HVMC Account 06" style="flex:1"><input id="slot" placeholder="account-06 (optioneel)" style="flex:1"><button id="addBtn">Account toevoegen</button></div>
    <div id="msg" class="msg">Laden…</div>
    <div id="summary" class="summary"></div>
    <div id="grid" class="grid"></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);let session=sessionStorage.getItem('hvmc_admin_session')||'';
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'authorization':'Bearer '+session,'content-type':'application/json'};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok){if(r.status===401){logout()}throw Error(d.error||'API-fout')}return d}
async function login(){const username=$('username').value.trim(),password=$('password').value;if(!username||!password){$('loginMsg').textContent='Vul gebruikersnaam en wachtwoord in.';return}try{const r=await fetch('/v1/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok)throw Error(d.error||'Inloggen mislukt');session=d.token;sessionStorage.setItem('hvmc_admin_session',session);$('password').value='';showApp();await load()}catch(e){$('loginMsg').textContent=e.message}}
function showApp(){$('loginPage').classList.add('hidden');$('appPage').classList.remove('hidden')}
async function load(){try{const d=await api('/v1/status');const a=d.accounts||[];const free=a.filter(x=>x.enabled&&!x.busy).length,busy=a.filter(x=>x.busy).length,linked=a.filter(x=>x.microsoft_oid).length;$('msg').innerHTML='<span class="ok">Pool geladen.</span>';$('summary').innerHTML=`<span class="stat">${free} vrij</span><span class="stat">${busy} bezet</span><span class="stat">${linked} gekoppeld</span><span class="stat">${a.length} totaal</span>`;$('grid').innerHTML=a.map(x=>`<article class="card"><div class="cardtop"><div class="slot">${esc(x.label)}</div><span class="pill ${x.enabled?(x.busy?'busy':'free'):'off'}">${x.enabled?(x.busy?'BEZET':'VRIJ'):'UITGESCHAKELD'}</span></div><div class="meta">Slot: ${esc(x.slot)}<br>Microsoft: ${esc(x.microsoft_username||'Nog niet gekoppeld')}<br>${x.client_id?'PC: '+esc(x.client_id)+'<br>Lease tot: '+esc(x.expires_at||''):'Geen actieve lease.'}</div><div class="actions"><button onclick="linkAccount(${x.id})">${x.microsoft_oid?'Opnieuw koppelen':'Microsoft koppelen'}</button><button class="secondary" onclick="toggle(${x.id},${!x.enabled})">${x.enabled?'Uitschakelen':'Inschakelen'}</button><button class="warn" onclick="unlink(${x.id})">Loskoppelen</button><button class="danger" onclick="removeA(${x.id},${x.busy})">Verwijderen</button></div></article>`).join('')||'<div class="msg">Nog geen accounts.</div>'}catch(e){$('msg').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
async function linkAccount(id){try{const s=await api('/v1/admin/accounts/'+id+'/link/start',{method:'POST',body:'{}'});$('msg').innerHTML=`<span class="ok">Microsoft-koppeling gestart.</span> Open <a href="${esc(s.verificationUri)}" target="_blank" rel="noopener">${esc(s.verificationUri)}</a> en voer code <b>${esc(s.userCode)}</b> in. Wachten op toestemming…`;const deadline=Date.now()+s.expiresIn*1000;while(Date.now()<deadline){await new Promise(r=>setTimeout(r,Math.max(5000,s.interval? s.interval*1000:5000)));const p=await api('/v1/admin/accounts/'+id+'/link/poll',{method:'POST',body:JSON.stringify({attemptId:s.attemptId})});if(p.state==='complete'){ $('msg').innerHTML='<span class="ok">Microsoft-account succesvol gekoppeld.</span>';await load();return }if(p.state==='conflict'||p.state==='declined'||p.state==='expired'||p.state==='error'){throw Error(p.error||'Microsoft-koppeling mislukt.')} }throw Error('Microsoft-koppeling is verlopen.')}catch(e){$('msg').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
async function addAccount(){const label=$('label').value.trim(),slot=$('slot').value.trim();if(!label)return alert('Vul een accountnaam in.');try{await api('/v1/admin/accounts',{method:'POST',body:JSON.stringify({label,slot:slot||undefined})});$('label').value='';$('slot').value='';await load()}catch(e){alert(e.message)}}
async function toggle(id,enabled){try{await api('/v1/admin/accounts/'+id,{method:'PATCH',body:JSON.stringify({enabled})});load()}catch(e){alert(e.message)}}
async function unlink(id){if(!confirm('Microsoft-koppeling verwijderen?'))return;try{await api('/v1/admin/accounts/'+id+'/unlink',{method:'POST',body:'{}'});load()}catch(e){alert(e.message)}}
async function removeA(id,busy){if(busy)return alert('Geef het account eerst vrij.');if(!confirm('Accountslot definitief verwijderen?'))return;try{await api('/v1/admin/accounts/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
async function resetAll(){if(!confirm('Alle leases én Microsoft-koppelingen resetten?'))return;try{await api('/v1/admin/reset-mapping',{method:'POST',body:'{}'});load()}catch(e){alert(e.message)}}
async function logout(){const old=session;session='';sessionStorage.removeItem('hvmc_admin_session');if(old)try{await fetch('/v1/admin/logout',{method:'POST',headers:{authorization:'Bearer '+old}})}catch{}$('appPage').classList.add('hidden');$('loginPage').classList.remove('hidden');$('password').value=''}
$('loginBtn').onclick=login;$('addBtn').onclick=addAccount;$('refresh').onclick=load;$('reset').onclick=resetAll;$('logout').onclick=logout;
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
if(session){showApp();load()}
</script>
</body>
</html>
