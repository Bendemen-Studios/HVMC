<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVMC Admin</title><style>body{font-family:system-ui;background:#0b1017;color:#e8eef7;margin:0;padding:28px}main{max-width:1100px;margin:auto}.panel{background:#101925;border:1px solid #26364e;border-radius:16px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{padding:10px 12px;border-radius:10px;border:1px solid #2c3c55;background:#0b111a;color:#fff}button{cursor:pointer;background:#4f8cff;border:0;font-weight:700}.danger{background:#a33a4d}.warn{background:#765e20}.card{background:#111c29;border:1px solid #293a52;border-radius:14px;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.free{background:#153824;color:#83e0a2}.busy{background:#4d212a;color:#ff9fac}.off{background:#423a22;color:#f0cf76}.muted{color:#96a8bf;font-size:13px}.msg{margin-top:10px;color:#9db0c8}</style></head><body><main><h1>HVMC Admin</h1><div class="muted">Beheer de centrale Minecraft-accountpool.</div><section class="panel"><div class="row"><input id="token" type="password" placeholder="Admin token" style="flex:1"><button onclick="load()">Openen / vernieuwen</button><button class="danger" onclick="resetAll()">Alle leases resetten</button></div><div id="msg" class="msg">Nog niet geladen.</div></section><section class="panel"><h2>Account toevoegen</h2><div class="row"><input id="label" placeholder="Bijv. Minecraft Account 06" style="flex:1"><input id="slot" placeholder="account-06 (optioneel)" style="flex:1"><button onclick="addAccount()">Toevoegen</button></div></section><section class="panel"><div id="grid" class="grid"></div></section></main><script>const $=id=>document.getElementById(id);let token=localStorage.getItem('hvmc_admin_token')||'';$('token').value=token;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]));async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-token':token,'content-type':'application/json'};const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'API-fout');return d}async function load(){token=$('token').value.trim();if(!token){$('msg').textContent='Admin-token ontbreekt.';return}localStorage.setItem('hvmc_admin_token',token);try{const d=await api('/v1/status');const a=d.accounts||[];$('msg').textContent=`${a.filter(x=>x.enabled&&!x.busy).length} vrij · ${a.filter(x=>x.busy).length} bezet · ${a.length} totaal`;$('grid').innerHTML=a.map(x=>`<article class="card"><b>${esc(x.label)}</b> <span class="pill ${x.enabled?(x.busy?'busy':'free'):'off'}">${x.enabled?(x.busy?'BEZET':'VRIJ'):'UIT'}</span><div class="muted">Slot: ${esc(x.slot)}<br>Microsoft: ${esc(x.microsoft_username||'Nog niet gekoppeld')}<br>${x.client_id?'PC: '+esc(x.client_id)+'<br>Lease tot: '+esc(x.expires_at||''):'Geen actieve lease.'}</div><div class="row" style="margin-top:10px"><button onclick="toggle(${x.id},${!x.enabled})">${x.enabled?'Uitschakelen':'Inschakelen'}</button><button class="warn" onclick="unlink(${x.id})">Loskoppelen</button><button class="danger" onclick="removeA(${x.id},${x.busy})">Verwijderen</button></div></article>`).join('')||'<div class="muted">Geen accounts.</div>'}catch(e){$('msg').textContent=e.message}}async function addAccount(){const label=$('label').value.trim(),slot=$('slot').value.trim();if(!label)return alert('Vul een naam in.');try{await api('/v1/admin/accounts',{method:'POST',body:JSON.stringify({label,slot:slot||undefined})});$('label').value='';$('slot').value='';load()}catch(e){alert(e.message)}}async function toggle(id,enabled){try{await api('/v1/admin/accounts/'+id,{method:'PATCH',body:JSON.stringify({enabled})});load()}catch(e){alert(e.message)}}async function unlink(id){if(!confirm('Microsoft-koppeling verwijderen?'))return;try{await api('/v1/admin/accounts/'+id+'/unlink',{method:'POST',body:'{}'});load()}catch(e){alert(e.message)}}async function removeA(id,busy){if(busy)return alert('Bezet account eerst vrijgeven.');if(!confirm('Accountslot verwijderen?'))return;try{await api('/v1/admin/accounts/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}async function resetAll(){if(!confirm('Alle leases en Microsoft-koppelingen resetten?'))return;try{await api('/v1/admin/reset-mapping',{method:'POST',body:'{}'});load()}catch(e){alert(e.message)}}if(token)load();</script></body></html>
