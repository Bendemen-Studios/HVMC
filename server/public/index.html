<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVMC Admin</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8eef7;background:#080d14}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#172436,#080d14 58%)}main{max-width:1180px;margin:auto;padding:36px 20px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}h1{margin:0;font-size:32px}.sub{color:#94a3b8;margin-top:6px}.panel{background:rgba(12,19,29,.94);border:1px solid #223047;border-radius:18px;padding:20px;margin-bottom:18px}.auth,.add{display:grid;grid-template-columns:1fr auto;gap:10px}.add{grid-template-columns:1fr 1fr auto}.input{background:#0a111a;color:#e8eef7;border:1px solid #2a3950;border-radius:10px;padding:11px 12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:#4f8cff;color:white}.button.secondary{background:#273449}.button.danger{background:#9f3346}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{border:1px solid #29384e;border-radius:14px;padding:17px;background:#101925}.row{display:flex;justify-content:space-between;gap:10px}.slot{font-weight:800}.pill{border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.free{background:#123522;color:#7fe0a1}.busy{background:#4b2028;color:#ff9eae}.disabled{background:#3a3420;color:#f3cd71}.meta{color:#93a4ba;font-size:13px;line-height:1.6;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.summary{display:flex;gap:18px;flex-wrap:wrap;color:#b5c1d0}.msg{margin-top:10px;color:#94a3b8;font-size:13px}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.auth,.add{grid-template-columns:1fr}}</style></head>
<body><main><div class="top"><div><h1>HVMC Account Admin</h1><div class="sub">Centrale Minecraft-accountpool</div></div><div class="toolbar"><button class="button secondary" id="refresh">Vernieuwen</button><button class="button danger" id="reset">Alles resetten</button></div></div><section class="panel"><div class="auth"><input class="input" id="token" type="password" placeholder="Admin token"><button class="button" id="open">Dashboard openen</button></div><div id="msg" class="msg">Voer je admin-token in.</div></section><section class="panel"><div class="add"><input class="input" id="label" placeholder="Accountnaam, bv. HVMC Account 06"><input class="input" id="slot" placeholder="Slot, bv. account-06"><button class="button" id="add">Account toevoegen</button></div></section><section class="panel"><div id="summary" class="summary"></div><div id="grid" class="grid"><div class="msg">Nog geen gegevens geladen.</div></div></section></main>
<script>const tokenEl=document.getElementById('token'),grid=document.getElementById('grid'),summary=document.getElementById('summary'),msg=document.getElementById('msg');let token=localStorage.getItem('hvmc_admin_token')||'';tokenEl.value=token;const hdr=()=>({'x-admin-token':token,'content-type':'application/json'}),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]);
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...hdr(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
async function load(){token=tokenEl.value.trim();if(!token){msg.textContent='Admin-token ontbreekt.';return}localStorage.setItem('hvmc_admin_token',token);msg.textContent='Laden…';try{const d=await api('/v1/status');const a=d.accounts||[],busy=a.filter(x=>x.busy).length,free=a.filter(x=>!x.busy&&x.enabled).length;summary.textContent=`${free} vrij · ${busy} bezet · ${a.length} totaal`;grid.innerHTML=a.map(x=>`<article class="card"><div class="row"><div class="slot">${esc(x.label)}</div><span class="pill ${x.enabled?(x.busy?'busy':'free'):'disabled'}">${x.enabled?(x.busy?'BEZET':'VRIJ'):'UIT'}</span></div><div class="meta">Slot: ${esc(x.slot)}<br>Microsoft: ${esc(x.microsoft_username||'Niet gekoppeld')}<br>${x.client_id?`PC: ${esc(x.client_id)}<br>Verloopt: ${esc(x.expires_at||'')}`:'Geen actieve lease'}</div><div class="actions"><button class="button secondary" onclick="toggle(${x.id},${x.enabled?0:1})">${x.enabled?'Uitschakelen':'Inschakelen'}</button><button class="button secondary" onclick="unlink(${x.id})">Ontkoppelen</button><button class="button danger" onclick="removeAccount(${x.id})">Verwijderen</button></div></article>`).join('')||'<div class="msg">Geen accounts.</div>';msg.textContent='Gereed.'}catch(e){msg.textContent=e.message;grid.innerHTML='<div class="msg">Dashboard kon niet worden geladen.</div>'}}
async function addAccount(){try{const label=document.getElementById('label').value.trim(),slot=document.getElementById('slot').value.trim();if(!label){msg.textContent='Accountnaam ontbreekt.';return}await api('/v1/admin/accounts',{method:'POST',body:JSON.stringify({label,slot:slot||undefined})});document.getElementById('label').value='';document.getElementById('slot').value='';await load()}catch(e){msg.textContent=e.message}}
async function toggle(id,enabled){try{await api('/v1/admin/accounts/'+id,{method:'PATCH',body:JSON.stringify({enabled:!!enabled})});await load()}catch(e){msg.textContent=e.message}}
async function unlink(id){if(!confirm('Microsoft-koppeling verwijderen?'))return;try{await api('/v1/admin/accounts/'+id+'/unlink',{method:'POST',body:'{}'});await load()}catch(e){msg.textContent=e.message}}
async function removeAccount(id){if(!confirm('Account definitief verwijderen?'))return;try{await api('/v1/admin/accounts/'+id,{method:'DELETE'});await load()}catch(e){msg.textContent=e.message}}
document.getElementById('open').onclick=load;document.getElementById('refresh').onclick=load;document.getElementById('add').onclick=addAccount;document.getElementById('reset').onclick=async()=>{if(!confirm('Alle actieve leases en koppelingen resetten?'))return;try{await api('/v1/admin/reset-mapping',{method:'POST',body:'{}'});await load()}catch(e){msg.textContent=e.message}};if(token)load();</script></body></html>
