<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVMC PC Beheer</title>
<style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20251f;background:#f7f5ef;--gold:#c9972e;--gold2:#e2b84b;--ink:#1d241f;--muted:#68716a;--line:#dfd8c8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffdf9,#f5f1e7)}main{max-width:1400px;margin:auto;padding:30px 20px 60px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.brand{display:flex;gap:14px;align-items:center}.mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#d8ab43,#b98520);display:grid;place-items:center;color:#fff;font-weight:900}.kicker{color:#b48725;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:2px 0;font-size:30px}.sub{color:var(--muted)}.panel{background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 16px 40px rgba(81,65,32,.08);margin-top:16px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}input,select{background:#fff;border:1px solid #cfc6b2;border-radius:11px;padding:10px 12px}button{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#211b0e}button.secondary{background:#fff;border:1px solid #d6ccb8;color:#4c524d}button.danger{background:#b74848;color:#fff}.code{font:900 28px ui-monospace,monospace;letter-spacing:.16em}.muted{color:var(--muted)}.msg{margin-top:10px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:middle}.online{color:#2e7c4a;font-weight:800}.offline{color:#9a3d3d;font-weight:800}.blocked{color:#9a3d3d;font-weight:800}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:800px){table{font-size:13px}th:nth-child(3),td:nth-child(3),th:nth-child(6),td:nth-child(6){display:none}}</style></head>
<body><main>
<div class="top"><div class="brand"><div class="mark">HV</div><div><div class="kicker">Bendemen Studios</div><h1>HVMC PC Beheer</h1><div class="sub">Autorisaties, organisaties, status en accountgebruik.</div></div></div><div class="row"><button class="secondary" onclick="location.href='/admin'">Accountpool</button><button onclick="loadAll()">Vernieuwen</button></div></div>
<section class="panel"><h2>Nieuwe eenmalige PC-code</h2><div class="row"><button onclick="generateCode()">Genereer code</button><span id="code" class="code"></span><span id="codeExpiry" class="muted"></span></div><div class="msg">De code is 15 minuten geldig en kan maar één keer worden gebruikt.</div></section>
<section class="panel"><h2>Organisaties</h2><div class="row"><input id="orgName" placeholder="Nieuwe organisatie"><button onclick="addOrg()">Toevoegen</button></div><div id="orgs" class="row" style="margin-top:12px"></div></section>
<section class="panel"><h2>PC's</h2><div id="msg" class="msg">Laden...</div><table><thead><tr><th>PC</th><th>Status</th><th>Organisatie</th><th>Minecraft-account</th><th>Laatste verbinding</th><th>Client</th><th>Acties</th></tr></thead><tbody id="pcs"></tbody></table></section>
</main><script>
const auth=()=>({Authorization:'Bearer '+(localStorage.getItem('hvmcAdminToken')||'')});
async function api(path,opt={}){opt.headers={...auth(),...(opt.headers||{})};const r=await fetch(path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Fout');return j}
async function generateCode(){try{const j=await api('/v1/admin/pc-codes',{method:'POST'});document.getElementById('code').textContent=j.code;document.getElementById('codeExpiry').textContent='geldig tot '+new Date(j.expiresAt).toLocaleTimeString('nl-NL');}catch(e){msg(e.message)}}
async function addOrg(){const name=document.getElementById('orgName').value.trim();if(!name)return;try{await api('/v1/admin/organizations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});document.getElementById('orgName').value='';await loadAll()}catch(e){msg(e.message)}}
async function updatePc(id,body){try{await api('/v1/admin/pcs/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await loadAll()}catch(e){msg(e.message)}}
async function deletePc(id){if(!confirm('Deze PC verwijderen?'))return;try{await api('/v1/admin/pcs/'+id,{method:'DELETE'});await loadAll()}catch(e){msg(e.message)}}
function msg(t){document.getElementById('msg').textContent=t}
async function loadAll(){try{const [p,o]=await Promise.all([api('/v1/admin/pcs'),api('/v1/admin/organizations')]);const orgs=o.organizations||[];document.getElementById('orgs').innerHTML=orgs.map(x=>`<span style="padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff">${esc(x.name)}</span>`).join('');document.getElementById('pcs').innerHTML=(p.pcs||[]).map(x=>{const org=orgs.find(o=>o.id===x.organization_id);return `<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.client_id)}</div></td><td class="${x.blocked?'blocked':x.online?'online':'offline'}">${x.blocked?'GEBLOKKEERD':x.online?'ONLINE':'OFFLINE'}</td><td><select onchange="updatePc(${x.id},{organizationId:this.value?Number(this.value):null})"><option value="">Geen</option>${orgs.map(o=>`<option value="${o.id}" ${o.id===x.organization_id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></td><td>${x.account_label?esc(x.account_label)+'<div class="muted">'+esc(x.microsoft_username||'')+'</div>':'<span class="muted">Geen</span>'}</td><td>${x.last_seen_at?new Date(x.last_seen_at).toLocaleString('nl-NL'):'-'}</td><td>${esc(x.launcher_version||'-')}<div class="muted">${esc(x.os_version||'')}</div></td><td><div class="actions"><button class="secondary" onclick="renamePc(${x.id},'${escJs(x.name)}')">Naam</button><button onclick="updatePc(${x.id},{blocked:${!x.blocked}})">${x.blocked?'Deblokkeren':'Blokkeren'}</button><button class="danger" onclick="deletePc(${x.id})">Verwijder</button></div></td></tr>`}).join('');msg(`${p.pcs?.length||0} PC's geladen.`)}catch(e){msg(e.message);if((e.message||'').toLowerCase().includes('unauthorized'))location.href='/admin'}}
async function renamePc(id,current){const name=prompt('PC-naam',current);if(name&&name.trim())await updatePc(id,{name:name.trim()})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escJs(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
loadAll();setInterval(loadAll,30000);
</script></body></html>
